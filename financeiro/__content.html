<script>
// ══════════════════════════════════════════════════════════
//  ESTOFARIA DIGITAL — MÓDULO FINANCEIRO
//  Lógica baseada na Agenda Financeira (portada para vanilla JS)
// ══════════════════════════════════════════════════════════

// ── Relógio ────────────────────────────────────────────────
;(function tick(){
  const el = document.getElementById('fin-time')
  if(el) el.textContent = new Date().toLocaleString('pt-BR')
  setTimeout(tick, 1000)
})()

// ── Chaves de armazenamento ────────────────────────────────
const FIN_RECEBER_KEY = 'fin_receber_v1'
const FIN_PAGAR_KEY   = 'fin_pagar_v1'

function loadReceber(){ try{ return JSON.parse(localStorage.getItem(FIN_RECEBER_KEY)||'[]') }catch{ return [] } }
function loadPagar()  { try{ return JSON.parse(localStorage.getItem(FIN_PAGAR_KEY)  ||'[]') }catch{ return [] } }
function saveReceber(arr){ try{ localStorage.setItem(FIN_RECEBER_KEY, JSON.stringify(arr)) }catch(_){} }
function savePagar(arr)  { try{ localStorage.setItem(FIN_PAGAR_KEY,   JSON.stringify(arr)) }catch(_){} }

// ── Formatação ─────────────────────────────────────────────
function money(v){
  return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})
}
function fmtDate(iso){
  if(!iso) return ''
  const s = String(iso).substring(0,10)
  const [y,m,d] = s.split('-')
  return `${d}/${m}/${y}`
}
function todayStr(){ return new Date().toISOString().split('T')[0] }
function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6) }
function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }

// ── Status efetivo (computa atrasado a partir da data) ─────
function computeStatus(item, tipo){
  const done = tipo==='receber' ? 'recebido' : 'pago'
  if(item.status === done) return done
  const venc = new Date(String(item.dataVencimento).substring(0,10)+'T00:00:00')
  const now  = new Date(); now.setHours(0,0,0,0)
  if(venc < now) return 'atrasado'
  return 'pendente'
}
function statusLabel(s){ return {pendente:'Pendente',recebido:'Recebido',pago:'Pago',atrasado:'Atrasado'}[s]||s }

// ── Reconhecer parcelas "Nome (N/Total)" ───────────────────
function parseParcela(nome){
  const m = String(nome||'').match(/^(.+) \((\d+)\/(\d+)\)$/)
  return m ? { base:m[1], atual:parseInt(m[2]), total:parseInt(m[3]) } : null
}

// ── Estado da interface ────────────────────────────────────
let currentTab     = 'painel'
let currentContaTab= 'receber'
let calYear        = new Date().getFullYear()
let calMonth       = new Date().getMonth()  // 0-indexed
let selectedDay    = null
const expandedGrupos = new Set()

// Estado do modal
let modoTipo  = 'receber'  // 'receber' | 'pagar'
let modoLanc  = 'unico'    // 'unico' | 'mensal' | 'parcelado'

// ══════════════════════════════════════════════════════════
//  NAVEGAÇÃO POR TABS
// ══════════════════════════════════════════════════════════
function switchTab(tab){
  currentTab = tab
  document.querySelectorAll('.fin-tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab===tab))
  document.querySelectorAll('.fin-tab-content').forEach(c => c.style.display = c.id==='tab-'+tab ? '' : 'none')
  if(tab==='painel') renderPainel()
  if(tab==='agenda') renderAgenda()
  if(tab==='contas') renderContas()
}

function switchContaTab(tab){
  currentContaTab = tab
  document.querySelectorAll('.fin-contas-tab').forEach(b => b.classList.toggle('active', b.dataset.contaTab===tab))
  document.getElementById('fin-lista-receber').style.display = tab==='receber' ? '' : 'none'
  document.getElementById('fin-lista-pagar').style.display   = tab==='pagar'   ? '' : 'none'
}

// ══════════════════════════════════════════════════════════
//  PAINEL
// ══════════════════════════════════════════════════════════
function renderPainel(){
  const receber = loadReceber()
  const pagar   = loadPagar()

  // Resumo do mês
  const now = new Date()
  const mesInicio = new Date(now.getFullYear(), now.getMonth(), 1)
  const mesFim    = new Date(now.getFullYear(), now.getMonth()+1, 0, 23, 59, 59)

  const totalR = receber.filter(c=>{
    const d=new Date(String(c.dataVencimento).substring(0,10)+'T00:00:00')
    return d>=mesInicio && d<=mesFim && computeStatus(c,'receber')!=='recebido'
  }).reduce((a,c)=>a+Number(c.valor),0)

  const totalP = pagar.filter(c=>{
    const d=new Date(String(c.dataVencimento).substring(0,10)+'T00:00:00')
    return d>=mesInicio && d<=mesFim && computeStatus(c,'pagar')!=='pago'
  }).reduce((a,c)=>a+Number(c.valor),0)

  const saldo = totalR - totalP
  document.getElementById('fin-total-receber').textContent  = money(totalR)
  document.getElementById('fin-total-pagar').textContent    = money(totalP)
  document.getElementById('fin-saldo-previsto').textContent = money(saldo)
  document.getElementById('fin-saldo-previsto').className   = 'fin-resumo-valor '+(saldo>=0?'blue':'red')

  // Semana — próximos 7 dias
  const hoje   = new Date(); hoje.setHours(0,0,0,0)
  const semFim = new Date(hoje); semFim.setDate(semFim.getDate()+6); semFim.setHours(23,59,59,999)

  const [d0,d1] = [
    hoje.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}),
    semFim.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})
  ]
  document.getElementById('fin-semana-titulo').textContent = `Resumo da semana — ${d0} a ${d1}`

  const brutos = [
    ...receber.filter(c=>computeStatus(c,'receber')!=='recebido').map(c=>({...c,_tipo:'receber',_nome:c.descricao||c.cliente||''})),
    ...pagar.filter(c=>computeStatus(c,'pagar')!=='pago').map(c=>({...c,_tipo:'pagar',_nome:c.descricao||c.fornecedor||''}))
  ].filter(item=>{
    const d=new Date(String(item.dataVencimento).substring(0,10)+'T00:00:00')
    return d>=hoje && d<=semFim
  }).sort((a,b)=>a.dataVencimento.localeCompare(b.dataVencimento))

  renderSemana(brutos)
}

function renderSemana(brutos){
  // Agrupar parcelas pelo padrão "Nome (N/Total)"
  const grupoMap = new Map()
  const lista    = []
  for(const item of brutos){
    const p = parseParcela(item._nome)
    const chave = p ? `${item._tipo}|||${p.base}` : null
    if(p && chave){
      if(!grupoMap.has(chave)){
        const g = {...item, _nome:p.base, _isGrupo:true, _grupoItens:[], valor:0}
        grupoMap.set(chave, g)
        lista.push(g)
      }
      const g = grupoMap.get(chave)
      g._grupoItens.push(item)
      g.valor = g._grupoItens.reduce((a,c)=>a+Number(c.valor),0)
      // Data = próxima parcela
      g.dataVencimento = g._grupoItens[0].dataVencimento
    } else {
      lista.push(item)
    }
  }

  const el = document.getElementById('fin-semana-list')
  if(!lista.length){
    el.innerHTML = `<div class="fin-semana-vazio">
      <span class="material-icons" style="color:#4a67a1">event_available</span>
      Nenhum vencimento esta semana
    </div>`
    return
  }

  el.innerHTML = lista.map(item=>{
    const st    = computeStatus(item, item._tipo)
    const hoje2 = new Date(); hoje2.setHours(0,0,0,0)
    const dvenc = new Date(String(item.dataVencimento).substring(0,10)+'T00:00:00')
    const dias  = Math.round((dvenc-hoje2)/86400000)
    const atrasado = st==='atrasado'
    const dotCls   = atrasado ? 'orange' : item._tipo==='receber' ? 'green' : 'red'
    const valCls   = atrasado ? 'orange' : item._tipo==='receber' ? 'green' : 'red'
    const metaTxt  = atrasado ? 'Atrasado' : dias===0 ? 'Vence hoje' : `Em ${dias} dia${dias!==1?'s':''}`
    // IDs para marcar em lote
    const ids = item._isGrupo ? item._grupoItens.map(i=>i.id).join(',') : item.id
    const tipo= item._tipo

    return `<div class="fin-semana-item">
      <span class="fin-semana-dot ${dotCls}"></span>
      <div class="fin-semana-info">
        <div class="fin-semana-nome">${escHtml(item._nome)}${item._isGrupo ? `&nbsp;<span style="font-size:10px;background:#eef0fa;color:#4a67a1;border-radius:99px;padding:1px 5px;font-weight:700">${item._grupoItens.length}×</span>` : ''}</div>
        <div class="fin-semana-meta">${fmtDate(item.dataVencimento)} · ${metaTxt}</div>
      </div>
      <span class="fin-semana-valor ${valCls}">${money(Number(item.valor))}</span>
      <button class="fin-semana-check" onclick="marcarSemana(${JSON.stringify(ids)},${JSON.stringify(tipo)})" title="Marcar como pago">✓</button>
    </div>`
  }).join('')
}

// ══════════════════════════════════════════════════════════
//  AGENDA — CALENDÁRIO
// ══════════════════════════════════════════════════════════
const MESES       = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro']
const DIAS_SEMANA = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb']

function renderAgenda(){
  const receber = loadReceber()
  const pagar   = loadPagar()
  renderCalendar(receber, pagar)
}

function renderCalendar(receber, pagar){
  const primeiroDia = new Date(calYear, calMonth, 1)
  const ultimoDia   = new Date(calYear, calMonth+1, 0)
  const leadBlanks  = primeiroDia.getDay()
  const todayISO    = todayStr()

  // Mapa dia → { receber[], pagar[] }
  const dayMap = {}
  const addToMap = (items, tipo) => items.forEach(item=>{
    const d = String(item.dataVencimento||'').substring(0,10)
    if(!d) return
    const [y,m] = d.split('-')
    if(parseInt(y)!==calYear || parseInt(m)-1!==calMonth) return
    if(!dayMap[d]) dayMap[d] = {receber:[],pagar:[]}
    dayMap[d][tipo].push(item)
  })
  addToMap(receber,'receber')
  addToMap(pagar,'pagar')

  function getDotCls(dateStr){
    const e = dayMap[dateStr]
    if(!e) return null
    const hasR = e.receber.some(c=>computeStatus(c,'receber')!=='recebido')
    const hasP = e.pagar.some(c=>computeStatus(c,'pagar')!=='pago')
    if(!hasR && !hasP) return 'concluido'
    const atR = e.receber.some(c=>computeStatus(c,'receber')==='atrasado')
    const atP = e.pagar.some(c=>computeStatus(c,'pagar')==='atrasado')
    if(atR||atP) return 'orange'
    if(hasP) return 'red'
    return 'green'
  }

  // Totais do mês exibido
  const filter = (arr, tipo) => arr.filter(c=>{
    const d = String(c.dataVencimento||'').substring(0,10)
    const [y,m] = d.split('-')
    return parseInt(y)===calYear && parseInt(m)-1===calMonth && computeStatus(c,tipo)!==(tipo==='receber'?'recebido':'pago')
  })
  const totalR = filter(receber,'receber').reduce((a,c)=>a+Number(c.valor),0)
  const totalP = filter(pagar,'pagar').reduce((a,c)=>a+Number(c.valor),0)

  // Grid
  const blanks = '<div class="fin-cal-blank"></div>'.repeat(leadBlanks)
  let days = ''
  for(let d=1; d<=ultimoDia.getDate(); d++){
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`
    const dotCls  = getDotCls(dateStr)
    const isTod   = dateStr===todayISO
    const isSel   = dateStr===selectedDay
    days += `<div class="fin-cal-day${isSel?' selected':''}${isTod&&!isSel?' is-today':''}" onclick="selectDay(${JSON.stringify(dateStr)})">
      <span class="fin-cal-day-num">${d}</span>
      ${dotCls?`<span class="fin-cal-dot ${dotCls}"></span>`:''}
    </div>`
  }

  document.getElementById('fin-calendar').innerHTML = `
    <div class="fin-cal-card">
      <div class="fin-cal-nav">
        <button class="fin-cal-nav-btn" onclick="calNav(-1)">‹</button>
        <span class="fin-cal-month">${MESES[calMonth]} ${calYear}</span>
        <button class="fin-cal-nav-btn" onclick="calNav(1)">›</button>
      </div>
      <div class="fin-cal-header-row">
        ${DIAS_SEMANA.map(d=>`<div class="fin-cal-header-cell">${d}</div>`).join('')}
      </div>
      <div class="fin-cal-grid">${blanks}${days}</div>
      <div class="fin-cal-totals">
        <div class="fin-cal-total-item">
          <span class="fin-cal-total-dot green"></span>
          <span style="color:#2e7d32">Receber: ${money(totalR)}</span>
        </div>
        <div class="fin-cal-total-item">
          <span class="fin-cal-total-dot red"></span>
          <span style="color:#c62828">Pagar: ${money(totalP)}</span>
        </div>
      </div>
    </div>`

  renderDayDetail(receber, pagar)
}

function selectDay(dateStr){
  selectedDay = selectedDay===dateStr ? null : dateStr
  renderAgenda()
}

function calNav(delta){
  calMonth += delta
  if(calMonth<0)  { calMonth=11; calYear-- }
  if(calMonth>11) { calMonth=0;  calYear++ }
  selectedDay = null
  renderAgenda()
}

function renderDayDetail(receber, pagar){
  const el = document.getElementById('fin-day-detail')
  if(!selectedDay){ el.innerHTML=''; return }

  const itemsR = receber.filter(c=>String(c.dataVencimento||'').substring(0,10)===selectedDay)
    .map(c=>({...c,_tipo:'receber',_nome:c.descricao||c.cliente||''}))
  const itemsP = pagar.filter(c=>String(c.dataVencimento||'').substring(0,10)===selectedDay)
    .map(c=>({...c,_tipo:'pagar',_nome:c.descricao||c.fornecedor||''}))
  const items = [...itemsR,...itemsP]

  if(!items.length){ el.innerHTML=''; return }

  const [y,m,d] = selectedDay.split('-')
  el.innerHTML = `<div class="fin-day-detail">
    <div class="fin-day-detail-title">${d}/${m}/${y}</div>
    ${items.map(item=>{
      const st   = computeStatus(item,item._tipo)
      const done = item._tipo==='receber' ? 'recebido' : 'pago'
      const clrVal = item._tipo==='receber' ? '#2e7d32' : '#c62828'
      return `<div class="fin-day-item">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600;color:#222;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(item._nome)}</div>
          <div style="font-size:11px;color:#999;margin-top:2px">${item._tipo==='receber'?'A receber':'A pagar'} &bull; <span class="fin-badge ${st}">${statusLabel(st)}</span></div>
        </div>
        <span style="font-size:14px;font-weight:700;color:${clrVal};margin:0 8px;flex-shrink:0">${money(Number(item.valor))}</span>
        <button class="fin-btn-check${st===done?' done':''}" onclick="marcarItem(${JSON.stringify(item.id)},${JSON.stringify(item._tipo)})" title="Marcar">✓</button>
        <button class="fin-btn-del" onclick="excluirItem(${JSON.stringify(item.id)},${JSON.stringify(item._tipo)})" title="Excluir">
          <span class="material-icons" style="font-size:18px">delete</span>
        </button>
      </div>`
    }).join('')}
  </div>`
}

// ══════════════════════════════════════════════════════════
//  CONTAS
// ══════════════════════════════════════════════════════════
function renderContas(){
  renderListaReceber()
  renderListaPagar()
  updateContasCounts()
}

function updateContasCounts(){
  const cntR = loadReceber().filter(c=>computeStatus(c,'receber')!=='recebido').length
  const cntP = loadPagar().filter(c=>computeStatus(c,'pagar')!=='pago').length
  const elR = document.getElementById('fin-cnt-receber')
  const elP = document.getElementById('fin-cnt-pagar')
  if(elR) elR.textContent = cntR||''
  if(elP) elP.textContent = cntP||''
}

function agrupar(items, getNome){
  const grupos = new Map()
  const avulsos = []
  for(const item of items){
    const nome = getNome(item)
    const p = parseParcela(nome)
    if(p){
      if(!grupos.has(p.base)) grupos.set(p.base,{base:p.base,itens:[]})
      grupos.get(p.base).itens.push(item)
    } else { avulsos.push(item) }
  }
  return { grupos:Array.from(grupos.values()), avulsos }
}

function renderListaReceber(){
  const receber = loadReceber()
  const el = document.getElementById('fin-lista-receber')
  if(!receber.length){ el.innerHTML='<div class="fin-empty">Nenhuma conta a receber</div>'; return }
  const { grupos, avulsos } = agrupar(receber, c=>c.descricao||c.cliente||'')
  let html = grupos.map(g=>renderGrupo(g,'receber')).join('')
           + avulsos.map(c=>renderAvulso(c,'receber')).join('')
  el.innerHTML = html || '<div class="fin-empty">Nenhuma conta a receber</div>'
}

function renderListaPagar(){
  const pagar = loadPagar()
  const el = document.getElementById('fin-lista-pagar')
  if(!pagar.length){ el.innerHTML='<div class="fin-empty">Nenhuma conta a pagar</div>'; return }
  const { grupos, avulsos } = agrupar(pagar, c=>c.descricao||c.fornecedor||'')
  let html = grupos.map(g=>renderGrupo(g,'pagar')).join('')
           + avulsos.map(c=>renderAvulso(c,'pagar')).join('')
  el.innerHTML = html || '<div class="fin-empty">Nenhuma conta a pagar</div>'
}

function renderGrupo(g, tipo){
  const key     = `${tipo}|||${g.base}`
  const isOpen  = expandedGrupos.has(key)
  const done    = tipo==='receber' ? 'recebido' : 'pago'
  const pagas   = g.itens.filter(i=>computeStatus(i,tipo)===done).length
  const total   = g.itens.length
  const valorTotal = g.itens.reduce((a,c)=>a+Number(c.valor),0)
  const numCls  = tipo==='receber' ? 'green' : 'red'
  const valCls  = tipo==='receber' ? 'green' : 'red'
  const proxima = [...g.itens]
    .sort((a,b)=>a.dataVencimento.localeCompare(b.dataVencimento))
    .find(i=>computeStatus(i,tipo)!==done)

  let bdgCls = 'pendente'
  if(pagas===total) bdgCls = done
  else if(g.itens.some(i=>computeStatus(i,tipo)==='atrasado')) bdgCls = 'atrasado'

  let html = `<div class="fin-conta-card">
    <div class="fin-grupo-header" onclick="toggleGrupo(${JSON.stringify(key)})">
      <div class="fin-grupo-num ${numCls}">${total}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600;color:#222;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(g.base)}</div>
        <div style="font-size:11px;color:#999;margin-top:2px">${total} parcela${total!==1?'s':''} · ${proxima?'Próx: '+fmtDate(proxima.dataVencimento):'Todas concluídas'}</div>
      </div>
      <div style="text-align:right;flex-shrink:0;margin-right:6px">
        <div class="fin-conta-valor ${valCls}">${money(valorTotal)}</div>
        <span class="fin-badge ${bdgCls}">${pagas}/${total} pago${pagas!==1?'s':''}</span>
      </div>
      <span class="fin-expand-btn">${isOpen?'▲':'▼'}</span>
    </div>`

  if(isOpen){
    const sorted = [...g.itens].sort((a,b)=>a.dataVencimento.localeCompare(b.dataVencimento))
    html += `<div class="fin-grupo-body">${sorted.map((item,i)=>{
      const st = computeStatus(item,tipo)
      const clrVal = tipo==='receber'?'#2e7d32':'#c62828'
      return `<div class="fin-grupo-row">
        <span style="font-size:11px;color:#aaa;width:20px;text-align:center;flex-shrink:0">${i+1}</span>
        <div style="flex:1;min-width:0;font-size:12px;color:#666">${fmtDate(item.dataVencimento)}</div>
        <span style="font-size:12px;font-weight:700;color:${clrVal};margin-right:4px">${money(Number(item.valor))}</span>
        <span class="fin-badge ${st}">${statusLabel(st)}</span>
        <button class="fin-btn-check${computeStatus(item,tipo)===done?' done':''}" onclick="marcarItem(${JSON.stringify(item.id)},${JSON.stringify(tipo)})">✓</button>
        <button class="fin-btn-del" onclick="excluirItem(${JSON.stringify(item.id)},${JSON.stringify(tipo)})">
          <span class="material-icons" style="font-size:16px">delete</span>
        </button>
      </div>`
    }).join('')}</div>`
  }
  html += '</div>'
  return html
}

function renderAvulso(item, tipo){
  const st   = computeStatus(item,tipo)
  const done = tipo==='receber' ? 'recebido' : 'pago'
  const nome = item.descricao || (tipo==='receber' ? item.cliente : item.fornecedor) || ''
  const valCls = tipo==='receber' ? 'green' : 'red'
  return `<div class="fin-conta-card">
    <div class="fin-conta-row">
      <div class="fin-conta-info">
        <div class="fin-conta-nome">${escHtml(nome)}</div>
        <div class="fin-conta-meta">Vence: ${fmtDate(item.dataVencimento)}${item.formaPagamento?' · '+item.formaPagamento:''}</div>
        <span class="fin-badge ${st}">${statusLabel(st)}</span>
      </div>
      <div class="fin-conta-right">
        <div class="fin-conta-valor ${valCls}">${money(Number(item.valor))}</div>
        <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:8px">
          <button class="fin-btn-check${st===done?' done':''}" onclick="marcarItem(${JSON.stringify(item.id)},${JSON.stringify(tipo)})" title="Marcar como ${done}">✓</button>
          <button class="fin-btn-del" onclick="excluirItem(${JSON.stringify(item.id)},${JSON.stringify(tipo)})" title="Excluir">
            <span class="material-icons" style="font-size:18px">delete</span>
          </button>
        </div>
      </div>
    </div>
  </div>`
}

function toggleGrupo(key){
  if(expandedGrupos.has(key)) expandedGrupos.delete(key)
  else expandedGrupos.add(key)
  renderContas()
}

// ══════════════════════════════════════════════════════════
//  AÇÕES: MARCAR / EXCLUIR
// ══════════════════════════════════════════════════════════
function marcarItem(id, tipo){
  if(tipo==='receber'){
    const arr = loadReceber()
    const i = arr.findIndex(c=>c.id===id)
    if(i<0) return
    arr[i].status = arr[i].status==='recebido' ? 'pendente' : 'recebido'
    saveReceber(arr)
  } else {
    const arr = loadPagar()
    const i = arr.findIndex(c=>c.id===id)
    if(i<0) return
    arr[i].status = arr[i].status==='pago' ? 'pendente' : 'pago'
    savePagar(arr)
  }
  refreshAll()
}

function marcarSemana(idsStr, tipo){
  const ids = String(idsStr).split(',')
  if(tipo==='receber'){
    const arr = loadReceber()
    arr.forEach(c=>{ if(ids.includes(c.id)) c.status='recebido' })
    saveReceber(arr)
  } else {
    const arr = loadPagar()
    arr.forEach(c=>{ if(ids.includes(c.id)) c.status='pago' })
    savePagar(arr)
  }
  refreshAll()
}

function excluirItem(id, tipo){
  if(!confirm('Excluir este lançamento?')) return
  if(tipo==='receber') saveReceber(loadReceber().filter(c=>c.id!==id))
  else                 savePagar(loadPagar().filter(c=>c.id!==id))
  refreshAll()
}

function refreshAll(){
  if(currentTab==='painel') renderPainel()
  if(currentTab==='agenda') renderAgenda()
  if(currentTab==='contas') renderContas()
}

//  MODAL
// ══════════════════════════════════════════════════════════
function _resetModal(){
  document.getElementById('fin-modal-desc').value       = ''
  document.getElementById('fin-modal-cliente').value    = ''
  document.getElementById('fin-modal-fornecedor').value = ''
  document.getElementById('fin-modal-categoria').value  = ''
  document.getElementById('fin-modal-valor').value      = ''
  document.getElementById('fin-modal-data').value       = todayStr()
  document.getElementById('fin-modal-pagamento').value  = 'PIX'
  document.getElementById('fin-modal-parcelas').value   = '2'
  document.getElementById('fin-parcelas-preview').textContent = ''
  document.getElementById('fin-campo-parcelas').style.display = 'none'
}

function abrirModal(tipo){
  _resetModal()
  modoLanc = 'unico'
  setLancModal('unico')
  setTipoModal(tipo||'receber')
  document.getElementById('finModal').classList.add('open')
}

function abrirModalRecorrente(tipo){
  _resetModal()
  modoLanc = 'mensal'
  setLancModal('mensal')
  setTipoModal(tipo||'pagar')
  document.getElementById('finModal').classList.add('open')
}

function fecharModal(){
  document.getElementById('finModal').classList.remove('open')
}

function setTipoModal(tipo){
  modoTipo = tipo
  const btnR = document.getElementById('fin-modal-tipo-receber')
  const btnP = document.getElementById('fin-modal-tipo-pagar')
  btnR.className = 'fin-tipo-btn' + (tipo==='receber'?' active-receber':'')
  btnP.className = 'fin-tipo-btn' + (tipo==='pagar'  ?' active-pagar'  :'')
  document.getElementById('fin-campo-cliente').style.display    = tipo==='receber' ? '' : 'none'
  document.getElementById('fin-campo-fornecedor').style.display = tipo==='pagar'   ? '' : 'none'
  document.getElementById('fin-campo-categoria').style.display  = tipo==='pagar'   ? '' : 'none'
}

function setLancModal(lanc){
  modoLanc = lanc
  document.querySelectorAll('.fin-lanc-opt').forEach(el=>{
    el.classList.toggle('active', el.dataset.lanc===lanc)
  })
  document.getElementById('fin-campo-parcelas').style.display = lanc==='parcelado' ? '' : 'none'
  _atualizarParcelasPreview()
}

function _atualizarParcelasPreview(){
  const el    = document.getElementById('fin-parcelas-preview')
  const n     = Math.max(2, parseInt(document.getElementById('fin-modal-parcelas').value)||2)
  const valor = parseFloat(String(document.getElementById('fin-modal-valor').value).replace(',','.'))||0
  if(valor && modoLanc==='parcelado') el.textContent = `× ${money(valor/n)} = ${money(valor)}`
  else el.textContent = ''
}

document.getElementById('fin-modal-parcelas').addEventListener('input', _atualizarParcelasPreview)
document.getElementById('fin-modal-valor').addEventListener('input', _atualizarParcelasPreview)

function salvar(){
  const descricao  = document.getElementById('fin-modal-desc').value.trim()
  const cliente    = document.getElementById('fin-modal-cliente').value.trim()
  const fornecedor = document.getElementById('fin-modal-fornecedor').value.trim()
  const categoria  = document.getElementById('fin-modal-categoria').value.trim()
  const valorRaw   = String(document.getElementById('fin-modal-valor').value).replace(',','.')
  const dataVenc   = document.getElementById('fin-modal-data').value
  const formaPag   = document.getElementById('fin-modal-pagamento').value
  const nParcelas  = Math.max(2, parseInt(document.getElementById('fin-modal-parcelas').value)||2)
  const valor      = parseFloat(valorRaw)||0

  if(!valor)    { alert('Informe o valor.'); return }
  if(!dataVenc) { alert('Informe a data.'); return }

  const nomeBase = descricao || (modoTipo==='receber' ? cliente : fornecedor)
  if(!nomeBase) { alert('Informe a descrição'+(modoTipo==='receber'?' ou o cliente':' ou o fornecedor')+'.'); return }

  const baseDate = new Date(dataVenc+'T12:00:00')

  function makeData(baseDate, i){
    const d = new Date(baseDate); d.setMonth(d.getMonth()+i)
    return d.toISOString().split('T')[0]
  }

  const btn = document.getElementById('fin-btn-salvar')
  if(btn){ btn.disabled=true; btn.textContent='Salvando...' }

  try {
    if(modoTipo==='receber'){
      const arr = loadReceber()
      if(modoLanc==='unico'){
        arr.push({ id:genId(), descricao:nomeBase, cliente:cliente||nomeBase, valor, dataVencimento:dataVenc, status:'pendente', formaPagamento:formaPag })
      } else if(modoLanc==='mensal'){
        for(let i=0;i<12;i++){
          arr.push({ id:genId(), descricao:`${nomeBase} (${i+1}/12)`, cliente:cliente||nomeBase, valor, dataVencimento:makeData(baseDate,i), status:'pendente', formaPagamento:formaPag })
        }
      } else { // parcelado
        const vParcela = valor/nParcelas
        for(let i=0;i<nParcelas;i++){
          arr.push({ id:genId(), descricao:`${nomeBase} (${i+1}/${nParcelas})`, cliente:cliente||nomeBase, valor:vParcela, dataVencimento:makeData(baseDate,i), status:'pendente', formaPagamento:formaPag })
        }
      }
      saveReceber(arr)
    } else {
      const arr = loadPagar()
      const cat = categoria||'Outros'
      if(modoLanc==='unico'){
        arr.push({ id:genId(), descricao:nomeBase, fornecedor:fornecedor||nomeBase, valor, dataVencimento:dataVenc, status:'pendente', formaPagamento:formaPag, categoria:cat })
      } else if(modoLanc==='mensal'){
        for(let i=0;i<12;i++){
          arr.push({ id:genId(), descricao:`${nomeBase} (${i+1}/12)`, fornecedor:fornecedor||nomeBase, valor, dataVencimento:makeData(baseDate,i), status:'pendente', formaPagamento:formaPag, categoria:cat })
        }
      } else {
        const vParcela = valor/nParcelas
        for(let i=0;i<nParcelas;i++){
          arr.push({ id:genId(), descricao:`${nomeBase} (${i+1}/${nParcelas})`, fornecedor:fornecedor||nomeBase, valor:vParcela, dataVencimento:makeData(baseDate,i), status:'pendente', formaPagamento:formaPag, categoria:cat })
        }
      }
      savePagar(arr)
    }
    fecharModal()
    refreshAll()
  } finally {
    if(btn){ btn.disabled=false; btn.textContent='Salvar' }
  }
}
