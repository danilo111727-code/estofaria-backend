name: Remove legacy model routes dev

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/remove-legacy-model-routes-dev.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Remove legacy model routes only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/routes/operations.js')
          text = path.read_text()
          start = "router.get('/models', (req, res) => {"
          end = "router.get('/agenda/config', (req, res) => {"

          if start not in text:
              raise SystemExit('start marker not found')
          if end not in text:
              raise SystemExit('end marker not found')

          before, rest = text.split(start, 1)
          _legacy, after = rest.split(end, 1)
          cleaned = before.rstrip() + "\n\n" + end + after

          forbidden = [
              "router.get('/models'",
              "router.post('/models'",
              "router.put('/models/:id'",
              "router.delete('/models/:id'",
              "personalization-items'",
          ]
          leftovers = [needle for needle in forbidden if needle in cleaned]
          if leftovers:
              raise SystemExit(f'legacy routes remain: {leftovers}')

          path.write_text(cleaned)
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/operations.js
          git diff --cached --quiet && exit 0
          git commit -m 'test(v2): physically remove legacy model routes'
          git push origin dev
