name: Temporary Load Test 200

on:
  push:
    branches: [dev]
    paths: [.github/workflows/temp-loadtest-200.yml]

permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS ${{ env.BASE_URL }}/api/health >/dev/null; then
              sleep 10
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Run 200 VU browser-like test
        env:
          BASE_URL: https://estofaria-backend-dev.onrender.com
          ORIGIN: https://estofaria-frontend.pages.dev
          VUS: "200"
          DURATION_SECONDS: "60"
        run: |
          python - <<'PY'
          import concurrent.futures, json, os, random, string, threading, time
          import urllib.error, urllib.request

          BASE=os.environ['BASE_URL'].rstrip('/')
          ORIGIN=os.environ['ORIGIN']
          VUS=int(os.environ['VUS'])
          DURATION=int(os.environ['DURATION_SECONDS'])

          def request(method,path,token=None,body=None,timeout=30):
              headers={'Accept':'application/json','Origin':ORIGIN}
              data=None
              if token: headers['Authorization']=f'Bearer {token}'
              if body is not None:
                  headers['Content-Type']='application/json'
                  data=json.dumps(body).encode()
              req=urllib.request.Request(BASE+path,data=data,headers=headers,method=method)
              t0=time.perf_counter()
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as resp:
                      return resp.status,(time.perf_counter()-t0)*1000,resp.read()
              except urllib.error.HTTPError as e:
                  return e.code,(time.perf_counter()-t0)*1000,e.read()
              except Exception as e:
                  return 0,(time.perf_counter()-t0)*1000,str(e).encode()

          def preflight(path):
              headers={'Origin':ORIGIN,'Access-Control-Request-Method':'GET','Access-Control-Request-Headers':'authorization'}
              req=urllib.request.Request(BASE+path,headers=headers,method='OPTIONS')
              t0=time.perf_counter()
              try:
                  with urllib.request.urlopen(req,timeout=30) as resp:
                      resp.read(); return resp.status,(time.perf_counter()-t0)*1000
              except urllib.error.HTTPError as e:
                  e.read(); return e.code,(time.perf_counter()-t0)*1000
              except Exception:
                  return 0,(time.perf_counter()-t0)*1000

          suffix=''.join(random.choice(string.ascii_lowercase+string.digits) for _ in range(12))
          email=f'loadtest-200-{suffix}@example.com'
          password='LoadTest!2026-'+suffix
          s,m,p=request('POST','/api/auth/register',body={'empresa':'TEMP LOADTEST 200 '+suffix,'nome':'Usuário de Carga','email':email,'password':password})
          if s!=201: raise SystemExit(f'register_failed status={s} body={p[:500]!r}')
          reg=json.loads(p); token=reg['token']; company_id=reg.get('user',{}).get('company_id')
          print(f'LOADTEST_ENV={BASE}')
          print(f'LOADTEST_COMPANY_ID={company_id}')
          print(f'REGISTER_MS={m:.1f}')

          order_ids=[]
          lock=threading.Lock()
          def seed_one(i):
              month=(i%8)+1; day=(i%27)+1; value=1200+(i%15)*175
              body={'cliente':f'Cliente Carga {i:03d}','descricao':f'Sofá teste {i:03d}',
                    'prod_date':f'2026-{month:02d}-{day:02d}','ent_date':f'2026-{month:02d}-{min(day+2,28):02d}',
                    'status':'pendente' if i%5 else 'entregue','qtd':1+(i%3),'valor_total':value,
                    'modelos':[{'name':f'Modelo {(i%12)+1}'}]}
              rs,rm,rp=request('POST','/api/agenda/orders',token=token,body=body)
              try:
                  data=json.loads(rp)
                  oid=data.get('id') or data.get('order',{}).get('id')
                  if oid:
                      with lock: order_ids.append(str(oid))
              except Exception: pass
              return rs
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
              seed_status=list(ex.map(seed_one,range(120)))
          bad=[x for x in seed_status if x not in (200,201)]
          if bad: raise SystemExit(f'seed_failed statuses={bad[:20]}')
          print(f'SEEDED=120 IDS={len(order_ids)}')

          for _ in range(3):
              ws,wm,_=request('GET','/api/dashboard/summary',token=token)
              print(f'WARMUP status={ws} ms={wm:.1f}')

          endpoints=['/api/dashboard/summary','/api/agenda/orders','/api/agenda/config','/api/financial/entries']
          latencies=[]; statuses={}; ep={p:[] for p in endpoints}; cycles=0
          deadline=time.perf_counter()+DURATION

          def one_vu(_):
              nonlocal_cycles=0
              while time.perf_counter()<deadline:
                  for path in endpoints:
                      ps,pms=preflight(path)
                      with lock:
                          latencies.append(pms); statuses[ps]=statuses.get(ps,0)+1
                  with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
                      futs={ex.submit(request,'GET',p,token,None,30):p for p in endpoints}
                      for fut,pth in futs.items():
                          rs,rm,_=fut.result()
                          with lock:
                              latencies.append(rm); ep[pth].append(rm); statuses[rs]=statuses.get(rs,0)+1
                  nonlocal_cycles+=1
                  time.sleep(random.uniform(7.0,11.0))
              return nonlocal_cycles

          started=time.perf_counter()
          with concurrent.futures.ThreadPoolExecutor(max_workers=VUS) as ex:
              cycle_counts=list(ex.map(one_vu,range(VUS)))
          elapsed=time.perf_counter()-started; cycles=sum(cycle_counts)

          def pct(vals,p):
              if not vals:return 0.0
              a=sorted(vals); return a[min(len(a)-1,max(0,int(round((len(a)-1)*p))))]

          total=len(latencies); errors=sum(v for k,v in statuses.items() if not (200<=int(k)<400))
          print('=== LOADTEST_RESULT ===')
          print(f'vus={VUS}')
          print(f'duration_s={elapsed:.2f}')
          print(f'panel_cycles={cycles}')
          print(f'total_http_requests={total}')
          print(f'requests_per_second={total/elapsed:.2f}')
          print(f'errors={errors}')
          print(f'error_rate_pct={(errors/total*100 if total else 0):.4f}')
          print(f'all_p50_ms={pct(latencies,.50):.1f}')
          print(f'all_p95_ms={pct(latencies,.95):.1f}')
          print(f'all_p99_ms={pct(latencies,.99):.1f}')
          print(f'all_max_ms={max(latencies) if latencies else 0:.1f}')
          print('statuses='+json.dumps(statuses,sort_keys=True))
          for path,vals in ep.items():
              print(f'endpoint={path} count={len(vals)} p50_ms={pct(vals,.50):.1f} p95_ms={pct(vals,.95):.1f} p99_ms={pct(vals,.99):.1f} max_ms={(max(vals) if vals else 0):.1f}')

          def cleanup(oid):
              return request('DELETE','/api/agenda/orders/'+oid,token=token,timeout=30)[0]
          if order_ids:
              with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
                  cleanup_status=list(ex.map(cleanup,order_ids))
              print('CLEANUP_ORDERS='+json.dumps({str(x):cleanup_status.count(x) for x in sorted(set(cleanup_status))}))
          print(f'EMPTY_TEST_COMPANY_REMAINS={company_id}')
          if errors: raise SystemExit('load test observed HTTP errors')
          PY
