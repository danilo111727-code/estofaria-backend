name: Validar contas fixas (PostgreSQL isolado)
on:
  push:
    branches:
      - fix/financeiro-pacote2-teste-20261017
  workflow_dispatch:
jobs:
  fixed-recurrence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: financial_fixed_test
          POSTGRES_USER: test_fixed
          POSTGRES_PASSWORD: test_only_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FINANCIAL_TEST_DATABASE_URL: postgres://test_fixed:test_only_disposable@127.0.0.1:5432/financial_fixed_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test test/financial-fixed-recurrence.test.js test/financial-history.test.js
