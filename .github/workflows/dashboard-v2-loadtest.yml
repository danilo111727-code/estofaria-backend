name: Dashboard V2 Load Test

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/dashboard-v2-loadtest.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-test-10-vus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for test backend
        run: |
          for i in $(seq 1 40); do
            if curl -fsS https://estofaria-backend-dev.onrender.com/api/health >/dev/null; then
              sleep 8
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Run browser-like Dashboard V2 load test
        env:
          BASE_URL: https://estofaria-backend-dev.onrender.com
          ORIGIN: https://estofaria-frontend.pages.dev
          VUS: "10"
          DURATION_SECONDS: "60"
        run: |
          python - <<'PY'
          import concurrent.futures
          import json
          import os
          import random
          import string
          import threading
          import time
          import urllib.error
          import urllib.request

          BASE = os.environ['BASE_URL'].rstrip('/')
          ORIGIN = os.environ['ORIGIN']
          VUS = int(os.environ.get('VUS', '10'))
          DURATION = int(os.environ.get('DURATION_SECONDS', '60'))

          def request(method, path, token=None, body=None, timeout=20):
              headers = {'Accept':'application/json', 'Origin':ORIGIN}
              data = None
              if token:
                  headers['Authorization'] = f'Bearer {token}'
              if body is not None:
                  headers['Content-Type'] = 'application/json'
                  data = json.dumps(body).encode()
              req = urllib.request.Request(BASE + path, data=data, headers=headers, method=method)
              t0 = time.perf_counter()
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      payload = resp.read()
                      return resp.status, (time.perf_counter()-t0)*1000, payload
              except urllib.error.HTTPError as e:
                  payload = e.read()
                  return e.code, (time.perf_counter()-t0)*1000, payload

          suffix = ''.join(random.choice(string.ascii_lowercase + string.digits) for _ in range(10))
          email = f'loadtest-{suffix}@example.com'
          password = 'LoadTest!2026-' + suffix
          status, ms, payload = request('POST','/api/auth/register', body={
              'empresa':'Carga Dashboard V2',
              'nome':'Usuário de Carga',
              'email':email,
              'password':password
          })
          if status != 201:
              raise SystemExit(f'register_failed status={status} body={payload[:500]!r}')
          reg = json.loads(payload)
          token = reg['token']
          print(f'LOADTEST account created company_id={reg.get("user",{}).get("company_id")} register_ms={ms:.1f}')

          def seed_one(i):
              month = (i % 8) + 1
              day = (i % 27) + 1
              value = 1200 + (i % 15) * 175
              body = {
                  'cliente': f'Cliente Carga {i:03d}',
                  'descricao': f'Sofá teste {i:03d}',
                  'prod_date': f'2026-{month:02d}-{day:02d}',
                  'ent_date': f'2026-{month:02d}-{min(day+2,28):02d}',
                  'status': 'pendente' if i % 5 else 'entregue',
                  'qtd': 1 + (i % 3),
                  'valor_total': value,
                  'modelos': [{'name': f'Modelo {(i % 12)+1}'}]
              }
              return request('POST','/api/agenda/orders',token=token,body=body)

          seed_start = time.perf_counter()
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
              seeded = list(ex.map(seed_one, range(120)))
          bad_seed = [s for s,_,_ in seeded if s not in (200,201)]
          if bad_seed:
              raise SystemExit(f'seed_failed statuses={bad_seed[:10]}')
          print(f'LOADTEST seeded=120 elapsed_s={time.perf_counter()-seed_start:.2f}')

          for _ in range(3):
              s,m,_ = request('GET','/api/dashboard/summary',token=token)
              print(f'WARMUP status={s} ms={m:.1f}')

          endpoints = ['/api/dashboard/summary','/api/agenda/orders','/api/agenda/config','/api/financial/entries']
          lock = threading.Lock()
          latencies = []
          statuses = {}
          endpoint_latencies = {p:[] for p in endpoints}
          cycles = 0
          deadline = time.perf_counter() + DURATION

          def preflight(path):
              headers = {'Origin': ORIGIN,'Access-Control-Request-Method':'GET','Access-Control-Request-Headers':'authorization'}
              req = urllib.request.Request(BASE + path, headers=headers, method='OPTIONS')
              t0 = time.perf_counter()
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      resp.read(); return resp.status, (time.perf_counter()-t0)*1000
              except urllib.error.HTTPError as e:
                  e.read(); return e.code, (time.perf_counter()-t0)*1000

          def one_vu(vu_id):
              nonlocal cycles
              local_cycles = 0
              while time.perf_counter() < deadline:
                  for path in endpoints:
                      ps,pms = preflight(path)
                      with lock:
                          latencies.append(pms); statuses[ps] = statuses.get(ps,0)+1
                  with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
                      futs = {ex.submit(request,'GET',p,token,None,20):p for p in endpoints}
                      for fut,p in futs.items():
                          s,m,_ = fut.result()
                          with lock:
                              latencies.append(m); endpoint_latencies[p].append(m); statuses[s] = statuses.get(s,0)+1
                  local_cycles += 1
                  time.sleep(random.uniform(7.0,11.0))
              with lock: cycles += local_cycles

          started = time.perf_counter()
          with concurrent.futures.ThreadPoolExecutor(max_workers=VUS) as ex:
              list(ex.map(one_vu, range(VUS)))
          elapsed = time.perf_counter() - started

          def pct(values,p):
              if not values: return 0.0
              vals=sorted(values); idx=min(len(vals)-1,max(0,int(round((len(vals)-1)*p))))
              return vals[idx]

          total=len(latencies)
          errors=sum(v for k,v in statuses.items() if not (200 <= int(k) < 400))
          print('=== LOADTEST_RESULT ===')
          print(f'vus={VUS}')
          print(f'duration_s={elapsed:.2f}')
          print(f'panel_cycles={cycles}')
          print(f'total_http_requests={total}')
          print(f'requests_per_second={total/elapsed:.2f}')
          print(f'errors={errors}')
          print(f'error_rate_pct={(errors/total*100 if total else 0):.4f}')
          print(f'all_p50_ms={pct(latencies,.50):.1f}')
          print(f'all_p95_ms={pct(latencies,.95):.1f}')
          print(f'all_p99_ms={pct(latencies,.99):.1f}')
          print(f'all_max_ms={max(latencies) if latencies else 0:.1f}')
          print('statuses=' + json.dumps(statuses,sort_keys=True))
          for path,vals in endpoint_latencies.items():
              print(f'endpoint={path} count={len(vals)} p50_ms={pct(vals,.50):.1f} p95_ms={pct(vals,.95):.1f} p99_ms={pct(vals,.99):.1f} max_ms={(max(vals) if vals else 0):.1f}')
          if errors: raise SystemExit('load test observed HTTP errors')
          PY
