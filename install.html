<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a2340">
  <title>Instalar — Estofaria Digital</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#eaeef5;color:#1a2540;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:#fff;border-radius:20px;padding:32px 24px;max-width:420px;width:100%;text-align:center;box-shadow:0 8px 32px rgba(30,50,100,.13)}
    h1{font-size:22px;font-weight:800;margin-bottom:12px;color:#1a2540}
    p{font-size:15px;color:#6b7a9a;line-height:1.6;margin-bottom:20px}
    .step{background:#f5f8ff;border-radius:14px;padding:14px 16px;margin-bottom:12px;text-align:left;font-size:14px;color:#1a2540;border:1px solid #dce5f5}
    .step strong{display:block;font-weight:700;margin-bottom:4px}
    a.btn{display:inline-block;background:#4267b2;color:#fff;text-decoration:none;border-radius:14px;padding:14px 28px;font-size:16px;font-weight:700;margin-top:8px}
  </style>
</head>
<body>
  <div class="card">
    <h1>Instalar Estofaria Digital</h1>
    <p>Para a melhor experiência, instale o app na tela inicial do seu celular.</p>
    <div class="step">
      <strong>No iPhone (Safari)</strong>
      Toque em <b>Compartilhar</b> → <b>Adicionar à Tela de Início</b>
    </div>
    <div class="step">
      <strong>No Android (Chrome)</strong>
      Toque no menu <b>⋮</b> → <b>Adicionar à tela inicial</b>
    </div>
    <a href="/login/?browser=1" class="btn">Acessar pelo navegador</a>
  </div>
</body>
</html>
