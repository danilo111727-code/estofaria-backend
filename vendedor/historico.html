/* ── Modal Finalizar Pedido ─────────────────────────────────── */
#fpOverlay{
  /* Sempre display:flex — toggling display:none→flex quebra align-items no Safari/iOS */
  display:flex;
  position:fixed;top:0;left:0;right:0;bottom:0;
  z-index:2000;
  background:rgba(0,0,0,.45);
  align-items:flex-end;justify-content:center;
  /* Esconder com visibility preserva o layout flex para quando abrir */
  visibility:hidden;pointer-events:none;
}
#fpOverlay.open{
  visibility:visible;pointer-events:auto;
}
.fp-sheet{
  background:#fff;border-radius:20px 20px 0 0;
  width:100%;max-width:640px;
  /* dvh: respeita a barra de endereço do Safari móvel */
  max-height:92vh;max-height:92dvh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:0 0 32px;
  box-shadow:0 -4px 32px rgba(0,0,0,.18);
}
.fp-handle{
  width:40px;height:4px;background:#ddd;border-radius:4px;
  margin:14px auto 0;
}
.fp-head{
  padding:16px 18px 8px;
  border-bottom:1px solid #eef0f6;
}
.fp-head h2{ margin:0 0 2px;font-size:17px;color:#2d3a5e }
.fp-total-line{
  font-size:13px;color:#666;
}
.fp-total-line strong{ color:#4c64a8 }
.fp-section{
  padding:14px 18px 0;
}
.fp-section-title{
  font-size:11px;font-weight:700;letter-spacing:.7px;
  color:#9aa3bf;text-transform:uppercase;margin:0 0 8px;
}
.fp-row{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
}
.fp-col{ display:flex;flex-direction:column }
.fp-sheet label{
  font-size:12px;color:#666;margin-bottom:3px;display:block;font-weight:600;
}
.fp-sheet input,.fp-sheet select,.fp-sheet textarea{
  width:100%;box-sizing:border-box;
  padding:9px 11px;
  border:1px solid #d8def1;border-radius:10px;
  font-size:14px;font-family:inherit;
  background:#fff;color:#222;
  margin-bottom:0;
}
.fp-sheet textarea{ min-height:60px;resize:vertical }
.fp-sheet input[readonly]{background:#f4f6fb;color:#777}
.fp-actions{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  padding:18px 18px 0;
}
.fp-btn-confirm{
  background:#4c64a8;color:#fff;border:none;
  padding:13px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;
}
.fp-btn-confirm:disabled{ opacity:.6 }
.fp-btn-cancel{
  background:#f0f2fa;color:#4c64a8;border:none;
  padding:13px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;
}

<script>
let selecionado=null
let filtro="todos"

function brlFromCents(cents){
  let v = Number(cents||0)/100
  return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})
}

function dataPreferida(o){
  if(o && o.payload && o.payload.created_at_local) return o.payload.created_at_local
  if(o && o.created_at){
    try{ return new Date(o.created_at).toLocaleDateString('pt-BR') }catch(e){}
  }
  return ''
}

async function fetchQuotes(){
  let url = '/api/quotes'
  if(filtro!=="todos") url += '?status=' + encodeURIComponent(filtro)
  const res = await fetch((window.API_BASE||'') + url)
  if(!res.ok) throw new Error('Falha ao carregar ('+res.status+')')
  return await res.json()
}

async function carregar(){
  let busca=document.getElementById("busca").value.toLowerCase()
  let div=document.getElementById("lista")
  div.innerHTML=""

  try{
    let lista = await fetchQuotes()
    lista.forEach(o=>{
      if(busca && !(o.cliente||"").toLowerCase().includes(busca)) return
      let card=document.createElement("div")
      card.className="card_orcamento"
      card.id="card_"+o.id
      card.innerHTML=`
        <div class="info_cliente">
          <b>${o.cliente||"Cliente"}</b><br>
          ${dataPreferida(o)} • ${brlFromCents(o.total_cents)}<br>
          <small>${o.status === 'pedido' ? '📦 Pedido' : '🧾 Orçamento'}</small>
        </div>
        <button class="menu_btn" aria-label="Opções">⋮</button>
      `
      const btn = card.querySelector('.menu_btn')
      btn.addEventListener('click', (e) => {
        e.stopPropagation()
        e.preventDefault()
        abrirMenu(e, o.id)
      })
      div.appendChild(card)
    })

    if(div.innerHTML===""){
      div.innerHTML = "<div style='padding:12px;color:#666'>Nenhum registro</div>"
    }
  }catch(e){
    console.error(e)
    div.innerHTML = "<div style='padding:12px;color:#c62828'>Não consegui carregar do servidor.</div>"
  }
}

function abrirMenu(e,id){
  if(e) e.stopPropagation()
  selecionado=id
  document.querySelectorAll(".card_orcamento").forEach(c=>c.classList.remove("ativo"))
  let card=document.getElementById("card_"+id)
  if(card) card.classList.add("ativo")
  const overlay = document.getElementById("overlay")
  if(!overlay) return
  // Posiciona o overlay exatamente na área visível do iframe (sem rolar a página pai)
  try {
    const frame = window.frameElement
    if(frame){
      const rect = frame.getBoundingClientRect()
      const parentViewH = (window.parent.visualViewport && window.parent.visualViewport.height)
                          || window.parent.innerHeight
      // Quantos px do topo da viewport estão ACIMA do iframe (0 se iframe já passou o topo)
      const iframeTopInViewport = Math.max(0, rect.top)
      // Quantos px do iframe já rolaram para FORA da viewport pelo topo
      const scrolledIntoIframe = Math.max(0, -rect.top)
      // Altura visível = viewport menos a parte que ainda está acima do iframe
      const visibleH = Math.max(300, parentViewH - iframeTopInViewport)
      overlay.style.cssText = [
        'position:absolute',
        'top:'    + scrolledIntoIframe + 'px',
        'left:0', 'right:0', 'bottom:auto',
        'height:' + visibleH + 'px'
      ].join(';')
    }
  } catch(_) {}
  overlay.classList.add("open")
}

function fechar(){
  const overlay = document.getElementById("overlay")
  if(!overlay) return
  overlay.classList.remove("open")
  overlay.style.cssText = ''
  document.querySelectorAll(".card_orcamento").forEach(c=>c.classList.remove("ativo"))
}

async function getSelecionado(){
  if(!selecionado) throw new Error('Nada selecionado')
  return await window.VendedorPDF.getQuote(selecionado)
}

async function agendaApi(path, options={}){
  const res = await fetch((window.API_BASE||'') + '/api' + path, {
    cache: options.cache || 'no-store',
    ...options,
    headers: {
      'Content-Type': 'application/json',
      ...(options.headers || {})
    }
  })
  const isJson = (res.headers.get('content-type')||'').includes('application/json')
  const body = isJson ? await res.json().catch(()=>({})) : await res.text().catch(()=> '')
  if(!res.ok){
    const msg = (body && (body.error || body.message)) || ('Falha em ' + path + ' (' + res.status + ')')
    throw new Error(msg)
  }
  return body
}

function toISODate(d){
  const year = d.getFullYear()
  const month = String(d.getMonth()+1).padStart(2,'0')
  const day = String(d.getDate()).padStart(2,'0')
  return `${year}-${month}-${day}`
}

function startOfWeek(base = new Date()){
  const d = new Date(base.getFullYear(), base.getMonth(), base.getDate())
  const day = d.getDay()
  const diff = day === 0 ? -6 : 1 - day
  d.setDate(d.getDate() + diff)
  d.setHours(0,0,0,0)
  return d
}

function addBusinessDays(date, days){
  const d = new Date(date)
  if(days <= 0) return d
  let added = 0
  while(added < days){
    d.setDate(d.getDate() + 1)
    const day = d.getDay()
    if(day !== 0 && day !== 6) added++
  }
  return d
}

function addScheduleDays(date, days, tipo){
  if(tipo === 'uteis') return addBusinessDays(date, days)
  const d = new Date(date)
  d.setDate(d.getDate() + days)
  return d
}

function getActiveAgendaOrders(rows){
  return (Array.isArray(rows) ? rows : [])
    .filter(o => !['entregue','cancelado'].includes(o.status))
    .sort((a,b) => String(a.prod_date||'').localeCompare(String(b.prod_date||'')) || Number(a.id||0) - Number(b.id||0))
}

function getSlotDatesByIndex(index, config){
  const vagas = Math.max(1, Number(config?.vagas_semana) || 1)
  const tipo = config?.tipo_dias || 'corrido'
  const prazo = Math.max(0, Number(config?.prazo_dias) || 0)
  const daysInWeek = tipo === 'uteis' ? 5 : 7

  const weekIndex = Math.floor(index / vagas)
  const slotIndex = index % vagas

  const weekStart = startOfWeek(new Date())
  weekStart.setDate(weekStart.getDate() + weekIndex * 7)

  let dayOffset = 0
  if(vagas <= 1){
    dayOffset = 0
  }else if(vagas <= daysInWeek){
    dayOffset = Math.round((slotIndex * (daysInWeek - 1)) / (vagas - 1))
  }else{
    dayOffset = Math.floor((slotIndex * daysInWeek) / vagas)
  }

  const prodDate = addScheduleDays(weekStart, dayOffset, tipo)
  const entDate = addScheduleDays(prodDate, prazo, tipo)

  return { prod: toISODate(prodDate), ent: toISODate(entDate) }
}

function buildAgendaDescricaoFromQuote(quote){
  const modelos = Array.isArray(quote?.payload?.modelos) ? quote.payload.modelos : []
  if(!modelos.length) return 'Pedido vindo da aba vendedor'

  return modelos.map(model => {
    const nome = String(model?.modelo || 'Modelo').trim()
    const metragem = Number(model?.metragem || 0)
    const itens = Array.isArray(model?.itens) ? model.itens : []
    const extras = itens.length ? ` + ${itens.length} item(ns)` : ''
    const metragemTxt = metragem > 0 ? ` ${metragem.toFixed(2)}m` : ''
    return `${nome}${metragemTxt}${extras}`.trim()
  }).join(' | ')
}

function getAgendaQuantidadeFromQuote(quote){
  const modelos = Array.isArray(quote?.payload?.modelos) ? quote.payload.modelos : []
  return Math.max(1, modelos.length || 1)
}

function getAgendaQuoteRef(quoteId){
  return `quote:${String(quoteId || '').trim()}`
}

async function registrarPedidoNaAgenda(quote){
  const quoteId = String(quote?.id || '')
  if(!quoteId) return { created:false, reason:'missing_quote_id' }

  const [config, orders] = await Promise.all([
    agendaApi('/agenda/config').catch(() => ({ prazo_dias: 7, vagas_semana: 5, tipo_dias: 'corrido' })),
    agendaApi('/agenda/orders').catch(() => ([]))
  ])

  const quoteRef = getAgendaQuoteRef(quoteId)
  const existing = (Array.isArray(orders) ? orders : []).find(row => {
    return String(row?.source_quote_id || '') === quoteId || String(row?.tecido || '') === quoteRef
  })
  if(existing) return { created:false, reason:'already_exists', row: existing }

  const slot = getSlotDatesByIndex(getActiveAgendaOrders(orders).length, config)
  const basePayload = {
    prod_date: slot.prod,
    ent_date: slot.ent,
    cliente: String(quote?.cliente || quote?.payload?.cliente || 'Cliente').trim() || 'Cliente',
    descricao: buildAgendaDescricaoFromQuote(quote),
    tecido: quoteRef,
    qtd: getAgendaQuantidadeFromQuote(quote),
    tecido_comprado: false,
    status: 'pendente'
  }

  try{
    const row = await agendaApi('/agenda/orders', {
      method:'POST',
      body: JSON.stringify({
        ...basePayload,
        source_quote_id: quoteId
      })
    })
    return { created:true, row, mode:'source_quote_id' }
  }catch(firstError){
    console.warn('Agenda sem suporte a source_quote_id, tentando fallback compatível.', firstError)
    const row = await agendaApi('/agenda/orders', {
      method:'POST',
      body: JSON.stringify(basePayload)
    })
    return { created:true, row, mode:'fallback_tecido' }
  }
}

async function excluir(){
  if(!selecionado) return
  if(!confirm("Excluir este registro?")) return
  try{
    const res = await fetch((window.API_BASE||'') + '/api/quotes/'+selecionado, { method:'DELETE' })
    if(!res.ok) throw new Error('Falha ao excluir ('+res.status+')')
    fechar()
    carregar()
  }catch(e){
    console.error(e)
    alert('Não consegui excluir no servidor.')
  }
}

function fpGetLoggedUserName(){
  try{
    const u = window.EstofariaAuth?.user || JSON.parse(localStorage.getItem('auth_user')||'{}')
    return String(u.nome || u.name || u.email || u.username || '').trim()
  }catch(_){ return '' }
}

let fpTotalValue = 0

function fpRecalcSaldo(){
  const raw = String(document.getElementById('fpValorEntrada')?.value||'').replace(/[^\d,]/g,'').replace(',','.')
  const entrada = parseFloat(raw) || 0
  const saldo = Math.max(0, fpTotalValue - entrada)
  const el = document.getElementById('fpSaldoRestante')
  if(el) el.value = saldo > 0 ? saldo.toLocaleString('pt-BR',{minimumFractionDigits:2}) : ''
}

async function abrirFinalizarPedido(){
  if(!selecionado) return
  fechar()

  // Load quote total and show in modal
  fpTotalValue = 0
  try{
    const q = await getSelecionado()
    fpTotalValue = Number(q.total_cents||0) / 100
    const el = document.getElementById('fpTotalDisplay')
    if(el) el.textContent = fpTotalValue.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})
  }catch(_){
    const el = document.getElementById('fpTotalDisplay')
    if(el) el.textContent = '—'
  }

  // Suggest next agenda delivery date
  let sugestaoEntrega = ''
  try{
    const [config, orders] = await Promise.all([
      agendaApi('/agenda/config').catch(()=>({prazo_dias:7,vagas_semana:5,tipo_dias:'corrido'})),
      agendaApi('/agenda/orders').catch(()=>[])
    ])
    const slot = getSlotDatesByIndex(getActiveAgendaOrders(orders).length, config)
    sugestaoEntrega = slot.ent
  }catch(_){}

  // Pre-fill fields
  const today = new Date().toISOString().split('T')[0]
  document.getElementById('fpDataPedido').value    = today
  document.getElementById('fpDataEntrega').value   = sugestaoEntrega
  document.getElementById('fpNomeVendedor').value  = fpGetLoggedUserName()
  document.getElementById('fpValorEntrada').value  = ''
  document.getElementById('fpSaldoRestante').value = ''
  ;['fpMeioFechamento','fpFormaPagamento'].forEach(id=>{
    const el = document.getElementById(id); if(el) el.value = ''
  })
  ;['fpParcelamento','fpObsPagamento'].forEach(id=>{
    const el = document.getElementById(id); if(el) el.value = ''
  })

  document.getElementById('fpOverlay').classList.add('open')
}

function fecharFinalizarPedido(){
  document.getElementById('fpOverlay').classList.remove('open')
}

async function confirmarFinalizarPedido(){
  if(!selecionado) return

  const dataPedido     = document.getElementById('fpDataPedido')?.value     || ''
  const dataEntrega    = document.getElementById('fpDataEntrega')?.value    || ''
  const meioFechamento = document.getElementById('fpMeioFechamento')?.value || ''
  const formaPagamento = document.getElementById('fpFormaPagamento')?.value || ''
  const parcelamento   = document.getElementById('fpParcelamento')?.value.trim()  || ''
  const obsPagamento   = document.getElementById('fpObsPagamento')?.value.trim()  || ''
  const nomeVendedor   = document.getElementById('fpNomeVendedor')?.value.trim()  || ''

  const entradaRaw = String(document.getElementById('fpValorEntrada')?.value||'').replace(/[^\d,]/g,'').replace(',','.')
  const valorEntrada  = parseFloat(entradaRaw) || 0
  const saldoRaw  = String(document.getElementById('fpSaldoRestante')?.value||'').replace(/[^\d,]/g,'').replace(',','.')
  const saldoRestante = parseFloat(saldoRaw)  || 0

  const btn = document.getElementById('fpConfirmBtn')
  if(btn){ btn.disabled = true; btn.textContent = 'Finalizando...' }

  try{
    // 1. Converter orçamento em pedido
    const convertRes = await fetch((window.API_BASE||'') + '/api/quotes/'+selecionado+'/convert-to-order', { method:'POST' })
    if(!convertRes.ok) throw new Error('Falha ao converter ('+convertRes.status+')')
    let row = await convertRes.json()

    // 2. Persistir campos do pedido via PATCH (best-effort)
    const extraPayload = {
      ...((row.payload)||{}),
      data_pedido:     dataPedido    || null,
      data_entrega:    dataEntrega   || null,
      meio_fechamento: meioFechamento || null,
      forma_pagamento: formaPagamento || null,
      valor_entrada:   valorEntrada  || null,
      saldo_restante:  saldoRestante || null,
      qtd_parcelas:    parcelamento  || null,
      obs_pagamento:   obsPagamento  || null,
      nome_vendedor:   nomeVendedor  || null
    }
    try{
      const patchRes = await fetch((window.API_BASE||'') + '/api/quotes/'+row.id, {
        method:'PATCH',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ payload: extraPayload })
      })
      if(patchRes.ok) row = await patchRes.json()
      else row = { ...row, payload: extraPayload }
    }catch(_){
      row = { ...row, payload: extraPayload }
    }

    // 3. Registrar na agenda com a data de entrega escolhida
    let agendaStatus = { created:false, reason:'not_attempted' }
    try{
      const quoteId = String(row?.id || '')
      const orders  = await agendaApi('/agenda/orders').catch(()=>[])
      const config  = await agendaApi('/agenda/config').catch(()=>({prazo_dias:7,vagas_semana:5,tipo_dias:'corrido'}))
      const quoteRef = `quote:${quoteId}`
      const existing = (Array.isArray(orders)?orders:[]).find(r=>
        String(r?.source_quote_id||'')=== quoteId || String(r?.tecido||'')===quoteRef)
      if(existing){
        agendaStatus = { created:false, reason:'already_exists', row:existing }
      }else{
        const slot = getSlotDatesByIndex(getActiveAgendaOrders(orders).length, config)
        const base = {
          prod_date: slot.prod,
          ent_date:  dataEntrega || slot.ent,
          cliente:   String(row?.cliente||row?.payload?.cliente||'Cliente').trim()||'Cliente',
          descricao: buildAgendaDescricaoFromQuote(row),
          tecido:    quoteRef,
          qtd:       getAgendaQuantidadeFromQuote(row),
          tecido_comprado: false,
          status: 'pendente'
        }
        try{
          const ar = await agendaApi('/agenda/orders',{ method:'POST', body:JSON.stringify({...base,source_quote_id:quoteId}) })
          agendaStatus = { created:true, row:ar, mode:'source_quote_id' }
        }catch(e1){
          const ar = await agendaApi('/agenda/orders',{ method:'POST', body:JSON.stringify(base) })
          agendaStatus = { created:true, row:ar, mode:'fallback_tecido' }
        }
      }
    }catch(agErr){
      agendaStatus = { created:false, reason:'error', error:agErr }
    }

    fecharFinalizarPedido()
    carregar()

    if(agendaStatus.created)
      alert('Pedido finalizado e registrado na agenda ✅')
    else if(agendaStatus.reason==='already_exists')
      alert('Pedido finalizado. Já estava na agenda ✅')
    else if(agendaStatus.reason==='error')
      alert('Pedido finalizado, mas não consegui registrar na agenda.')
    else
      alert('Pedido finalizado ✅')

  }catch(e){
    console.error(e)
    alert('Não consegui finalizar o pedido: ' + (e.message||e))
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = 'Finalizar Pedido' }
  }
}

async function baixar(){
  // Abre a janela ANTES do await para não perder o contexto de gesto (iOS/Android)
  window._pendingPdfWindow = window.open('', '_blank')
  try{
    const row = await getSelecionado()
    fechar()
    await window.VendedorPDF.downloadQuotePdf(row, row.status)
  }catch(e){
    if(window._pendingPdfWindow){ window._pendingPdfWindow.close(); window._pendingPdfWindow = null }
    console.error(e)
    alert('Não consegui visualizar o PDF.')
  }
}

async function enviar(){
  try{
    const row = await getSelecionado()
    fechar()
    await window.VendedorPDF.shareQuotePdf(row, row.status)
  }catch(e){
    console.error(e)
    alert('Não consegui enviar o PDF.')
  }
}

function editar(){
  if(!selecionado) return
  window.location.href = 'pdf-editor.html?id=' + selecionado
}

function setFiltro(f){
  filtro=f
  document.querySelectorAll(".filtros button").forEach(b=>b.classList.remove("ativo"))
  if(f=="todos") document.getElementById("f_todos").classList.add("ativo")
  if(f=="orcamento") document.getElementById("f_orc").classList.add("ativo")
  if(f=="pedido") document.getElementById("f_ped").classList.add("ativo")
  carregar()
}

document.getElementById("busca").addEventListener("input", carregar)
carregar()
