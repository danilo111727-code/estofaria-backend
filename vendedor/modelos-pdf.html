<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuração dos PDFs</title>
  <link rel="stylesheet" href="style.css?v=20260804b">
  <script src="../config.js"></script>
  <script src="../auth-guard.js"></script>
  <link rel="stylesheet" href="../mobile-fixes.css">
  <style>
    .pdf-type-card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-top: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,.07);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .pdf-type-info { flex: 1; min-width: 0; }
    .pdf-type-icon { font-size: 26px; margin-bottom: 3px; }
    .pdf-type-title { font-size: 15px; font-weight: 700; color: #1e2d50; }
    .pdf-type-desc { font-size: 12px; color: #60708f; margin-top: 2px; }
    .pdf-type-badge {
      font-size: 11px; background: #e8f5e9; color: #2e7d32;
      border-radius: 20px; padding: 2px 8px; margin-top: 5px;
      display: inline-block; font-weight: 600;
    }
    .pdf-type-badge.unconfigured { background: #f3f4f6; color: #9e9e9e; font-weight: 400; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,.48);
      z-index: 9000;
      display: none;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      align-items: flex-end;
      justify-content: center;
      transition: opacity .18s ease;
    }
    .modal-overlay.open {
      display: flex;
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }
    .modal-sheet {
      background: white; width: 100%; max-width: 520px;
      border-radius: 20px 20px 0 0; max-height: 92vh; overflow-y: auto;
    }
    .modal-handle {
      width: 40px; height: 4px; background: #dde3f0;
      border-radius: 2px; margin: 14px auto 0;
    }
    .modal-body { padding: 16px 20px 28px; }

    /* Progress */
    .wiz-progress { height: 4px; background: #e0e5f5; border-radius: 2px; margin-bottom: 6px; }
    .wiz-progress-bar { height: 100%; background: #4c64a8; border-radius: 2px; transition: width .28s ease; }
    .wiz-step-label { font-size: 11.5px; color: #8896b3; margin-bottom: 14px; letter-spacing: .3px; }

    .wiz-title { font-size: 18px; font-weight: 700; color: #1e2d50; margin-bottom: 4px; }
    .wiz-desc  { font-size: 13px; color: #60708f; margin-bottom: 18px; line-height: 1.5; white-space: pre-line; }

    /* Footer buttons */
    .wiz-footer { display: flex; gap: 10px; margin-top: 22px; }
    .wiz-footer .btn-back { background: #e8edf9 !important; color: #31456f !important; flex: 0 0 auto; }
    .wiz-footer .btn-next { flex: 1; }

    /* Logo picker */
    .logo-preview {
      border: 1.5px dashed #bcc7e5; border-radius: 12px; min-height: 88px;
      display: flex; align-items: center; justify-content: center;
      background: #fafbff; margin-bottom: 10px; cursor: pointer; overflow: hidden;
    }
    .logo-preview img { max-width: 100%; max-height: 120px; object-fit: contain; }
    .logo-hint { color: #8896b3; font-size: 13px; text-align: center; padding: 20px; }

    /* Toggle */
    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 15px 0; border-bottom: 1px solid #f0f3fb;
    }
    .toggle-row:last-child { border-bottom: none; }
    .toggle-label { font-size: 14px; color: #1e2d50; font-weight: 500; }
    .toggle-sub   { font-size: 12px; color: #8896b3; margin-top: 2px; }
    .tog {
      position: relative; width: 46px; height: 26px; flex-shrink: 0;
    }
    .tog input { opacity: 0; width: 0; height: 0; }
    .tog-track {
      position: absolute; inset: 0; background: #d8def1;
      border-radius: 13px; cursor: pointer; transition: background .2s;
    }
    .tog input:checked + .tog-track { background: #4c64a8; }
    .tog-track::before {
      content: ''; position: absolute; width: 20px; height: 20px;
      background: white; border-radius: 50%; top: 3px; left: 3px;
      transition: transform .2s; box-shadow: 0 1px 4px rgba(0,0,0,.15);
    }
    .tog input:checked + .tog-track::before { transform: translateX(20px); }

    /* Preview summary */
    .preview-card {
      background: #f4f7ff; border-radius: 12px; padding: 16px;
      font-size: 13px; color: #31456f; line-height: 1.7;
    }
    .preview-card strong { color: #1e2d50; }
    .preview-row { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #e4e9f5; padding: 3px 0; }
    .preview-row:last-child { border-bottom: none; }
    .preview-key { color: #8896b3; font-size: 12px; }
    .preview-val { color: #1e2d50; font-weight: 500; text-align: right; max-width: 60%; word-break: break-word; }

    /* Done */
    .done-box { text-align: center; padding: 24px 0 12px; }
    .done-icon { font-size: 52px; margin-bottom: 14px; }
    .done-msg  { font-size: 14px; color: #31456f; line-height: 1.55; }

    /* Error shake */
    @keyframes shake { 0%,100%{transform:none} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
    .shake { animation: shake .22s ease; }
  </style>
</head>
<body>
<div class="container">
  <div class="cabecalho">
    <h1>Configuração dos PDFs</h1>
    <div class="actions_row">
      <a href="historico.html"><button class="btn_topo">Histórico</button></a>
      <a href="#" onclick="history.back();return false;"><button class="btn_topo">← Voltar</button></a>
    </div>
  </div>

  <div class="pdf-type-card">
    <div class="pdf-type-info">
      <div class="pdf-type-icon">📄</div>
      <div class="pdf-type-title">PDF de Orçamento</div>
      <div class="pdf-type-desc">Proposta comercial enviada ao cliente</div>
      <span class="pdf-type-badge unconfigured" id="badgeOrcamento">Não configurado</span>
    </div>
    <button onclick="openWizard('orcamento')" data-wizard="orcamento" style="white-space:nowrap;flex-shrink:0">Editar</button>
  </div>

  <div class="pdf-type-card">
    <div class="pdf-type-info">
      <div class="pdf-type-icon">📋</div>
      <div class="pdf-type-title">PDF de Pedido</div>
      <div class="pdf-type-desc">Documento interno de produção e entrega</div>
      <span class="pdf-type-badge unconfigured" id="badgePedido">Não configurado</span>
    </div>
    <button onclick="openWizard('pedido')" data-wizard="pedido" style="white-space:nowrap;flex-shrink:0">Editar</button>
  </div>
</div>

<!-- ── Wizard modal ─────────────────────────────────────────────────────────── -->
<div class="modal-overlay" id="wizardOverlay">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-body">
      <div class="wiz-progress"><div class="wiz-progress-bar" id="wBar"></div></div>
      <div class="wiz-step-label" id="wLabel"></div>
      <div class="wiz-title"  id="wTitle"></div>
      <div class="wiz-desc"   id="wDesc"></div>
      <div id="wField"></div>
      <div class="wiz-footer">
        <button class="btn-back" id="wBtnBack" onclick="wizBack()">← Voltar</button>
        <button class="btn-next" id="wBtnNext" onclick="wizNext()">Próximo →</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ─── Storage ────────────────────────────────────────────────────────────── */
const SK = 'pdf_templates_v1'
function getAll(){ try{ return JSON.parse(localStorage.getItem(SK)||'[]') }catch(_){ return [] } }
function getT(type){ return getAll().find(t=>t.type===type)||null }
function saveT(tpl){ const l=getAll().filter(t=>t.type!==tpl.type); l.push(tpl); localStorage.setItem(SK,JSON.stringify(l)) }

/* ─── Badges ─────────────────────────────────────────────────────────────── */
function refreshBadges(){
  ;['orcamento','pedido'].forEach(tp=>{
    const tpl=getT(tp)
    const el=document.getElementById('badge'+tp[0].toUpperCase()+tp.slice(1))
    if(tpl&&(tpl.companyName||tpl.logo)){
      el.textContent='✔ Configurado'; el.className='pdf-type-badge'
    } else {
      el.textContent='Não configurado'; el.className='pdf-type-badge unconfigured'
    }
  })
}

/* ─── Step definitions ───────────────────────────────────────────────────── */
const STEPS_ORC = [
  { key:'logo',              type:'logo',     title:'Logo da empresa',
    desc:'Adicione o logo que aparecerá no cabeçalho do PDF de orçamento.' },
  { key:'companyName',       type:'text',     title:'Nome fantasia',
    desc:'Como a empresa é conhecida pelos clientes.', ph:'Ex: Estofaria do João', req:true },
  { key:'razaoSocial',       type:'text',     title:'Razão social',
    desc:'Razão social registrada da empresa.', ph:'Ex: João Silva Estofamentos ME' },
  { key:'cnpj',              type:'text',     title:'CNPJ',
    desc:'CNPJ da empresa (opcional).', ph:'00.000.000/0001-00' },
  { key:'endereco',          type:'text',     title:'Endereço',
    desc:'Endereço completo da empresa.', ph:'Rua, número, bairro, cidade' },
  { key:'telefone',          type:'text',     title:'Telefone',
    desc:'Número de telefone para contato.', ph:'(00) 0000-0000' },
  { key:'whatsapp',          type:'text',     title:'WhatsApp',
    desc:'Número de WhatsApp para contato.', ph:'(00) 00000-0000' },
  { key:'email',             type:'text',     title:'E-mail',
    desc:'E-mail da empresa (opcional).', ph:'contato@empresa.com.br' },
  { key:'validadeOrcamento', type:'text',     title:'Validade do orçamento',
    desc:'Por quantos dias o orçamento fica válido?', ph:'Ex: 7 dias', req:true },
  { key:'mensagemInicial',   type:'textarea', title:'Mensagem inicial',
    desc:'Texto de boas-vindas no início da proposta (opcional).', ph:'Ex: É um prazer apresentar nossa proposta...' },
  { key:'rodape',            type:'text',     title:'Rodapé',
    desc:'Mensagem de agradecimento no rodapé do PDF.', ph:'Ex: Obrigado pela preferência!', req:true },
  { key:'__preview',         type:'preview',  title:'Pré-visualização',
    desc:'Confira as informações configuradas antes de salvar.' },
  { key:'__save',            type:'done',     title:'Tudo pronto! 🎉',
    desc:'Seu PDF de orçamento está configurado e será usado automaticamente nos próximos documentos.' },
]

const STEPS_PED = [
  { key:'logo',                   type:'logo',     title:'Logo da empresa',
    desc:'Adicione o logo que aparecerá no cabeçalho do PDF de pedido.' },
  { key:'companyName',            type:'text',     title:'Nome fantasia',
    desc:'Como a empresa é conhecida pelos clientes.', ph:'Ex: Estofaria do João', req:true },
  { key:'razaoSocial',            type:'text',     title:'Razão social',
    desc:'Razão social registrada da empresa.', ph:'Ex: João Silva Estofamentos ME' },
  { key:'cnpj',                   type:'text',     title:'CNPJ',
    desc:'CNPJ da empresa (opcional).', ph:'00.000.000/0001-00' },
  { key:'endereco',               type:'text',     title:'Endereço',
    desc:'Endereço completo da empresa.', ph:'Rua, número, bairro, cidade' },
  { key:'telefone',               type:'text',     title:'Telefone',
    desc:'Número de telefone para contato.', ph:'(00) 0000-0000' },
  { key:'whatsapp',               type:'text',     title:'WhatsApp',
    desc:'Número de WhatsApp para contato.', ph:'(00) 00000-0000' },
  { key:'email',                  type:'text',     title:'E-mail',
    desc:'E-mail da empresa (opcional).', ph:'contato@empresa.com.br' },
  { key:'mensagemInicial',        type:'textarea', title:'Mensagem inicial',
    desc:'Texto que aparece no início do documento de pedido (opcional).', ph:'Ex: Pedido confirmado! Obrigado pela confiança.' },
  { key:'showDataPedido',         type:'toggle',   title:'Mostrar data do pedido?',
    desc:'Exibir a data em que o pedido foi realizado.' },
  { key:'showDataEntrega',        type:'toggle',   title:'Mostrar data prevista de entrega?',
    desc:'Exibir a data combinada de entrega do serviço.' },
  { key:'showFormaPagamento',     type:'toggle',   title:'Mostrar forma de pagamento?',
    desc:'Exibir a forma de pagamento acordada com o cliente.' },
  { key:'showValorEntrada',       type:'toggle',   title:'Mostrar valor de entrada?',
    desc:'Exibir o valor pago como entrada no pedido.' },
  { key:'showSaldoRestante',      type:'toggle',   title:'Mostrar saldo restante?',
    desc:'Exibir o valor que ainda será cobrado após a entrega.' },
  { key:'showMeioFechamento',     type:'toggle',   title:'Mostrar meio de fechamento?',
    desc:'Exibir como o pedido foi fechado.\nExemplos: Loja · WhatsApp · Instagram · Site · Telefone' },
  { key:'showAssinaturaCliente',  type:'toggle',   title:'Mostrar assinatura do cliente?',
    desc:'Incluir espaço para assinatura do cliente no rodapé do documento.' },
  { key:'showAssinaturaEmpresa',  type:'toggle',   title:'Mostrar assinatura da empresa?',
    desc:'Incluir espaço para assinatura da empresa no rodapé do documento.' },
  { key:'termoVenda',             type:'textarea', title:'Termo de venda',
    desc:'Texto do termo que aparece antes das assinaturas (opcional).\nCampo livre — escreva o texto completo.', ph:'Ex: Em caso de desistência, o valor será convertido em saldo para uma próxima compra.' },
  { key:'termoEntrega',           type:'textarea', title:'Termo de entrega',
    desc:'Condições adicionais sobre a entrega do serviço (opcional).', ph:'Ex: O prazo de entrega começa a contar a partir da aprovação do tecido.' },
  { key:'__preview',              type:'preview',  title:'Pré-visualização',
    desc:'Confira as informações configuradas antes de salvar.' },
  { key:'__save',                 type:'done',     title:'Tudo pronto! 🎉',
    desc:'Seu PDF de pedido está configurado e será usado automaticamente nos próximos documentos.' },
]

function stepsFor(t){ return t==='orcamento' ? STEPS_ORC : STEPS_PED }

/* ─── Wizard state ───────────────────────────────────────────────────────── */
let wType='', wStep=0, wData={}

function openWizard(type){
  wType=type; wStep=0
  const ex=getT(type)||{}
  const emp=ex.empresa||{}
  wData={
    logo:                  ex.logo||'',
    companyName:           ex.companyName||emp.nome||'',
    razaoSocial:           ex.razaoSocial||emp.razao_social||'',
    cnpj:                  ex.cnpj||emp.cnpj||'',
    endereco:              ex.endereco||emp.endereco||'',
    telefone:              ex.telefone||emp.telefone||'',
    whatsapp:              ex.whatsapp||emp.whatsapp||'',
    email:                 ex.email||emp.email||'',
    validadeOrcamento:     ex.validadeOrcamento||'7 dias',
    mensagemInicial:       ex.mensagemInicial||'',
    rodape:                ex.rodape||ex.footerText||'Obrigado pela preferência!',
    showDataPedido:        ex.showDataPedido!==false,
    showDataEntrega:       ex.showDataEntrega!==false,
    showFormaPagamento:    ex.showFormaPagamento!==false,
    showValorEntrada:      ex.showValorEntrada!==false,
    showSaldoRestante:     ex.showSaldoRestante!==false,
    showMeioFechamento:    ex.showMeioFechamento!==false,
    showAssinaturaCliente: ex.showAssinaturaCliente!==false,
    showAssinaturaEmpresa: ex.showAssinaturaEmpresa!==false,
    termoVenda:            ex.termoVenda||'',
    termoEntrega:          ex.termoEntrega||'',
  }
  document.getElementById('wizardOverlay').classList.add('open')
  renderStep()
}

function closeWizard(){
  document.getElementById('wizardOverlay').classList.remove('open')
  refreshBadges()
}

/* ─── Render ─────────────────────────────────────────────────────────────── */
function renderStep(){
  const steps=stepsFor(wType), step=steps[wStep], total=steps.length
  const pct=Math.round(((wStep+1)/total)*100)
  document.getElementById('wBar').style.width=pct+'%'
  document.getElementById('wLabel').textContent='Passo '+(wStep+1)+' de '+total
  document.getElementById('wTitle').textContent=step.title
  document.getElementById('wDesc').textContent=step.desc

  const btnBack=document.getElementById('wBtnBack')
  const btnNext=document.getElementById('wBtnNext')
  btnBack.style.display = wStep===0 ? 'none' : ''

  if(step.type==='done'){
    btnNext.textContent='Fechar'
    btnNext.onclick=closeWizard
    btnBack.style.display='none'
  } else if(step.key==='__preview'){
    btnNext.textContent='Salvar e continuar →'
    btnNext.onclick=wizNext
  } else {
    btnNext.textContent='Próximo →'
    btnNext.onclick=wizNext
  }

  buildField(step)
}

function buildField(step){
  const c=document.getElementById('wField')
  c.innerHTML=''

  if(step.type==='logo'){
    c.innerHTML=`
      <div class="logo-preview" id="logoPrev" onclick="document.getElementById('logoFile').click()">
        ${wData.logo
          ? `<img src="${escHtml(wData.logo)}" alt="Logo">`
          : `<div class="logo-hint">📷 Toque aqui para adicionar o logo</div>`}
      </div>
      <input type="file" id="logoFile" accept="image/*" style="display:none" onchange="onLogo(this)">
      ${wData.logo ? `<button class="action-secondary" onclick="clearLogo()" style="width:100%;margin-top:4px">Remover logo</button>` : ''}
    `

  } else if(step.type==='text'){
    const el=document.createElement('input')
    el.id='wF'; el.placeholder=step.ph||''; el.value=wData[step.key]||''
    el.addEventListener('input',()=>{ wData[step.key]=el.value })
    c.appendChild(el)

  } else if(step.type==='textarea'){
    const el=document.createElement('textarea')
    el.id='wF'; el.placeholder=step.ph||''; el.value=wData[step.key]||''
    el.rows=5
    el.addEventListener('input',()=>{ wData[step.key]=el.value })
    c.appendChild(el)

  } else if(step.type==='toggle'){
    c.innerHTML=`
      <div class="toggle-row">
        <div>
          <div class="toggle-label">Sim, mostrar no PDF</div>
          <div class="toggle-sub">Essa informação será incluída no documento</div>
        </div>
        <label class="tog">
          <input type="checkbox" id="wToggle" ${wData[step.key]!==false?'checked':''}
            onchange="wData['${step.key}']=this.checked">
          <span class="tog-track"></span>
        </label>
      </div>
    `

  } else if(step.type==='preview'){
    c.appendChild(buildPreview())

  } else if(step.type==='done'){
    c.innerHTML=`
      <div class="done-box">
        <div class="done-icon">✅</div>
        <div class="done-msg">As configurações foram salvas com sucesso e já estão ativas nos próximos PDFs.</div>
      </div>
    `
  }
}

function buildPreview(){
  const div=document.createElement('div')
  div.className='preview-card'
  const isOrc=wType==='orcamento'

  const rows=[
    ['Logo',           wData.logo ? '✔ Configurada' : '— Não adicionada'],
    ['Nome fantasia',  wData.companyName],
    ['Razão social',   wData.razaoSocial],
    ['CNPJ',           wData.cnpj],
    ['Endereço',       wData.endereco],
    ['Telefone',       wData.telefone],
    ['WhatsApp',       wData.whatsapp],
    ['E-mail',         wData.email],
    ...(isOrc ? [
      ['Validade',       wData.validadeOrcamento],
      ['Mensagem inicial', wData.mensagemInicial ? '✔' : '—'],
      ['Rodapé',         wData.rodape],
    ] : [
      ['Mensagem inicial',     wData.mensagemInicial ? '✔' : '—'],
      ['Data do pedido',       wData.showDataPedido ? 'Sim' : 'Não'],
      ['Data de entrega',      wData.showDataEntrega ? 'Sim' : 'Não'],
      ['Forma de pagamento',   wData.showFormaPagamento ? 'Sim' : 'Não'],
      ['Valor de entrada',     wData.showValorEntrada ? 'Sim' : 'Não'],
      ['Saldo restante',       wData.showSaldoRestante ? 'Sim' : 'Não'],
      ['Meio de fechamento',   wData.showMeioFechamento ? 'Sim' : 'Não'],
      ['Assinatura do cliente',wData.showAssinaturaCliente ? 'Sim' : 'Não'],
      ['Assinatura da empresa',wData.showAssinaturaEmpresa ? 'Sim' : 'Não'],
      ['Termo de venda',       wData.termoVenda ? '✔' : '—'],
      ['Termo de entrega',     wData.termoEntrega ? '✔' : '—'],
    ])
  ]

  div.innerHTML = rows.filter(r=>r[1]).map(([k,v])=>
    `<div class="preview-row"><span class="preview-key">${escHtml(k)}</span><span class="preview-val">${escHtml(String(v||'—'))}</span></div>`
  ).join('')
  return div
}

/* ─── Logo ───────────────────────────────────────────────────────────────── */
function onLogo(input){
  const f=input.files[0]; if(!f) return
  const r=new FileReader()
  r.onload=e=>{ wData.logo=e.target.result; buildField(stepsFor(wType)[wStep]) }
  r.readAsDataURL(f)
}
function clearLogo(){ wData.logo=''; buildField(stepsFor(wType)[wStep]) }

/* ─── Navigation ─────────────────────────────────────────────────────────── */
function wizBack(){ if(wStep>0){ wStep--; renderStep() } }

function wizNext(){
  const steps=stepsFor(wType), step=steps[wStep]

  // Required field check
  if(step.type==='text' && step.req && !String(wData[step.key]||'').trim()){
    const el=document.getElementById('wF')
    if(el){ el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),300); el.focus(); el.style.boxShadow='0 0 0 3px rgba(194,65,87,.2)'; setTimeout(()=>el.style.boxShadow='',1500) }
    return
  }

  // Save when reaching __save step
  if(steps[wStep+1] && steps[wStep+1].key==='__save') doSave()

  if(wStep < steps.length-1){ wStep++; renderStep() }
}

/* ─── Persist ────────────────────────────────────────────────────────────── */
function doSave(){
  const extras=[]
  if(wType==='pedido'){
    if(wData.termoVenda)            extras.push({ type:'text',      text:wData.termoVenda })
    if(wData.termoEntrega)          extras.push({ type:'text',      text:wData.termoEntrega })
    if(wData.showAssinaturaCliente) extras.push({ type:'signature', label:'Assinatura do cliente' })
    if(wData.showAssinaturaEmpresa) extras.push({ type:'signature', label:'Assinatura da empresa' })
  }

  saveT({
    type:           wType,
    logo:           wData.logo,
    companyName:    wData.companyName,
    razaoSocial:    wData.razaoSocial,
    empresa:{
      nome:         wData.companyName,
      razao_social: wData.razaoSocial,
      cnpj:         wData.cnpj,
      endereco:     wData.endereco,
      telefone:     wData.telefone,
      whatsapp:     wData.whatsapp,
      email:        wData.email,
    },

function escHtml(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

// Expose functions globally (needed when page runs inside iframe)
window.openWizard  = openWizard
window.closeWizard = closeWizard
window.wizBack     = wizBack
window.wizNext     = wizNext
window.onLogo      = onLogo
window.clearLogo   = clearLogo

// Attach Editar button listeners (belt-and-suspenders alongside onclick)
document.querySelectorAll('[data-wizard]').forEach(function(btn){
  btn.addEventListener('click', function(){ openWizard(btn.getAttribute('data-wizard')) })
})

// Close on backdrop tap
document.getElementById('wizardOverlay').addEventListener('click', function(e){
  if(e.target === document.getElementById('wizardOverlay')) closeWizard()
})

window.addEventListener('load', refreshBadges)
