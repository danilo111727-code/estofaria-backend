<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico</title>

  <script src="config.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="header-tabs.css">
</head>
<body>
  <div class="container">
    <div class="cabecalho">
      <h1>Histórico</h1>
      <a href="index.html"><button class="btn_topo">Voltar</button></a>
    </div>

    <input id="busca" placeholder="Pesquisar cliente">

    <div class="filtros">
      <button onclick="setFiltro('todos')" id="f_todos" class="ativo">Todos</button>
      <button onclick="setFiltro('orcamento')" id="f_orc">Orçamentos</button>
      <button onclick="setFiltro('pedido')" id="f_ped">Pedidos</button>
    </div>

    <div id="lista"></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="sheet">
      <div class="sheet_header" onclick="fechar()">✕</div>

      <button onclick="converter()">Converter em pedido</button>
      <button onclick="editar()">Editar PDF</button>
      <button onclick="enviar()">Enviar PDF</button>
      <button onclick="excluir()">Excluir</button>
    </div>
  </div>

  <script>
    let selecionado = null
    let filtro = "todos"

    function brlFromCents(cents){
      let v = Number(cents || 0) / 100
      return v.toLocaleString('pt-BR', { style:'currency', currency:'BRL' })
    }

    function dataPreferida(o){
      if(o && o.payload && o.payload.created_at_local) return o.payload.created_at_local
      if(o && o.created_at){
        try { return new Date(o.created_at).toLocaleDateString('pt-BR') } catch(e){}
      }
      return ''
    }

    function apiBase(){
      return (window.API_BASE || '').replace(/\/$/, '')
    }

    async function fetchQuotes(){
      let url = apiBase() + '/api/quotes'
      if(filtro !== "todos") url += '?status=' + encodeURIComponent(filtro)

      const res = await fetch(url)
      if(!res.ok) throw new Error('Falha ao carregar (' + res.status + ')')
      return await res.json()
    }

    async function carregar(){
      let busca = document.getElementById("busca").value.toLowerCase()
      let div = document.getElementById("lista")
      div.innerHTML = ""

      try{
        let lista = await fetchQuotes()

        lista.forEach(o => {
          if(busca && !(o.cliente || "").toLowerCase().includes(busca)) return

          let card = document.createElement("div")
          card.className = "card_orcamento"
          card.id = "card_" + o.id

          card.innerHTML = `
            <div class="info_cliente">
              <b>${o.cliente || "Cliente"}</b><br>
              ${dataPreferida(o)} • ${brlFromCents(o.total_cents)}
            </div>
            <button class="menu_btn" onclick="abrirMenu(event, ${o.id})">⋯</button>
          `

          div.appendChild(card)
        })

        if(div.innerHTML === ""){
          div.innerHTML = "<div style='padding:12px;color:#666'>Nenhum registro</div>"
        }

      }catch(e){
        console.error(e)
        div.innerHTML = "<div style='padding:12px;color:#c62828'>Não consegui carregar do servidor. Verifique se a API está no ar.</div>"
      }
    }

    function abrirMenu(e, id){
      e.stopPropagation()
      selecionado = id

      document.querySelectorAll(".card_orcamento").forEach(c => c.classList.remove("ativo"))

      let card = document.getElementById("card_" + id)
      if(card) card.classList.add("ativo")

      document.getElementById("overlay").style.display = "flex"
    }

    function fechar(){
      document.getElementById("overlay").style.display = "none"
      document.querySelectorAll(".card_orcamento").forEach(c => c.classList.remove("ativo"))
    }

    async function excluir(){
      if(!selecionado) return
      if(!confirm("Excluir este registro?")) return

      try{
        const res = await fetch(apiBase() + '/api/quotes/' + selecionado, { method:'DELETE' })
        if(!res.ok) throw new Error('Falha ao excluir (' + res.status + ')')

        fechar()
        carregar()
      }catch(e){
        console.error(e)
        alert('Não consegui excluir no servidor.')
      }
    }

    async function converter(){
      if(!selecionado) return

      try{
        const res = await fetch(apiBase() + '/api/quotes/' + selecionado + '/convert-to-order', { method:'POST' })
        if(!res.ok) throw new Error('Falha ao converter (' + res.status + ')')

        fechar()
        carregar()
      }catch(e){
        console.error(e)
        alert('Não consegui converter no servidor.')
      }
    }

    function editar(){ alert("Editor PDF em desenvolvimento") }
    function enviar(){ alert("Envio PDF em desenvolvimento") }

    function setFiltro(f){
      filtro = f

      document.querySelectorAll(".filtros button").forEach(b => b.classList.remove("ativo"))

      if(f == "todos") document.getElementById("f_todos").classList.add("ativo")
      if(f == "orcamento") document.getElementById("f_orc").classList.add("ativo")
      if(f == "pedido") document.getElementById("f_ped").classList.add("ativo")

      carregar()
    }

    document.addEventListener('DOMContentLoaded', function(){
      const busca = document.getElementById("busca")
      if(busca) busca.addEventListener("input", carregar)
      carregar()
    })
  </script>

  <script src="header-tabs.js"></script>
</body>
</html>
