  <div class="header-right">

</div>
<div class="nav">
  <a class="btn" data-module="painel" href="/painel/">📊 Painel</a>
  <a class="btn" data-module="material" href="/material/">🧵 Materiais</a>

<main class="shell-main">
  <div id="shellLoading" class="shell-loading">Carregando tela...</div>
  <div class="content-frame-wrap">
    <iframe id="contentFrame" class="content-frame" style="display:none" title="Conteúdo do módulo" scrolling="no"></iframe>
  </div>
</main>
<script>

(function(){
  function readUser(){
    try{ return JSON.parse(localStorage.getItem('auth_user') || 'null'); }catch(_){ return null; }
  }
  var user = readUser();
  var company = localStorage.getItem('company_name') ||
    localStorage.getItem('empresa_nome') ||
    localStorage.getItem('estofaria_company_name') ||
    (user && (user.company_name || user.empresa)) || '';
  var role = localStorage.getItem('role') ||
    localStorage.getItem('user_role') ||
    (user && user.role) || '';
  var sub = document.getElementById('headerSub');
  if(sub && (company || role)){
    sub.textContent = (company && role) ? company + ' · ' + role : (company || role);
  }
})();

function doLogout(){
  try {
    if(window.ESTOFARIA_AUTH && typeof window.ESTOFARIA_AUTH.clearSession === 'function'){
      window.ESTOFARIA_AUTH.clearSession();
    } else {
      localStorage.removeItem('estofaria_auth_session_v1');
      localStorage.removeItem('auth_token');
      localStorage.removeItem('auth_user');
      localStorage.removeItem('token');
    }
  } catch(_){}
  window.location.href = '/login/';
}
</script>
<!-- Banner de impersonação: exibido quando o Master acessa como cliente -->
<style>
#masterImpersonationBanner{
  position:fixed;top:0;left:0;right:0;z-index:99999;
  background:#b42318;color:#fff;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 18px;font-size:14px;font-weight:500;
  box-shadow:0 2px 8px rgba(0,0,0,0.3);
}
#masterImpersonationBanner button{
  background:#fff;color:#b42318;border:none;border-radius:6px;
  padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
}
#masterImpersonationBanner button:hover{background:#ffe4e4}
</style>
<div id="masterImpersonationBanner" style="display:none">
  <span id="masterImpersonationMsg">⚠️ Modo de acesso administrativo</span>
  <button type="button" onclick="exitImpersonation()">Voltar ao painel Master</button>
</div>
<script>
(function(){
  try {
    var raw = localStorage.getItem('master_impersonating')
    if(!raw) return
    var data = JSON.parse(raw)
    var banner = document.getElementById('masterImpersonationBanner')
    var msg    = document.getElementById('masterImpersonationMsg')
    if(banner && data){
      msg.textContent = '⚠️ Modo de acesso administrativo — Você está acessando a conta de "' +
        (data.company_name || 'cliente') + '"' +
        (data.impersonated_user ? ' (' + data.impersonated_user + ')' : '') + '.'
      banner.style.display = 'flex'
    }
  } catch(_){}
})()

function exitImpersonation(){
  try {
    var masterToken = localStorage.getItem('master_auth_token')
    var masterUser  = localStorage.getItem('master_auth_user')
    if(masterToken){
      localStorage.setItem('auth_token', masterToken)
      localStorage.setItem('token',      masterToken)
      if(masterUser) localStorage.setItem('auth_user', masterUser)
    }
    localStorage.removeItem('master_impersonating')
    localStorage.removeItem('master_auth_token')
    localStorage.removeItem('master_auth_user')
  } catch(_){}
  window.location.href = '/master/'
}
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs) {
    regs.forEach(function(r) { r.unregister(); });
  });
  caches.keys().then(function(keys) {
    keys.forEach(function(k) { caches.delete(k); });
  });
  navigator.serviceWorker.register('/sw.js', { scope: '/' });
}
</script>
