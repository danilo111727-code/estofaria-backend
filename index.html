<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Estofaria Digital — Agenda</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="header-tabs.css">
</head>
<body>
  <main class="container">
    <section class="card scroll">
      <h2>Pedidos da semana</h2>
      <table>
        <thead>
          <tr><th>Produção</th><th>Cliente</th><th>Descrição</th><th>Qtd</th></tr>
        </thead>
        <tbody id="pedidosSemana"></tbody>
      </table>
    </section>

    <section class="card">
      <h2>Próxima vaga disponível</h2>
      <div class="vagaBox">
        <div>
          <strong>Produção</strong>
          <p id="nextProd">--/--</p>
        </div>
        <div>
          <strong>Entrega</strong>
          <p id="nextEnt">--/--</p>
        </div>
        <div class="grafico">
          <div class="barra-container">
            <div id="barra" class="barra"></div>
          </div>
          <p id="barraTexto"></p>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Configurações</h2>
      <label>Prazo padrão (dias)</label>
      <input id="prazo" type="number" value="5">

      <label>Tipo de dias</label>
      <select id="tipoDias">
        <option value="corrido">Corrido</option>
        <option value="uteis">Úteis</option>
      </select>

      <label>Vagas por semana</label>
      <input id="vagas" type="number" value="10">

      <button onclick="salvarConfig()">Salvar configuração</button>
    </section>

    <section class="card">
      <h2>Novo pedido</h2>
      <input id="cliente" placeholder="Cliente">
      <input id="descricao" placeholder="Descrição">
      <input id="tecido" placeholder="Tecido">
      <input id="qtd" type="number" value="1">
      <button onclick="novoPedido()">Registrar pedido</button>
    </section>

    <section class="card" onclick="abrirFull('telaAgenda')">
      <h2>Agenda</h2>
    </section>

    <section class="card" onclick="abrirFull('telaHistorico')">
      <h2>Histórico</h2>
    </section>
  </main>

  <div id="telaAgenda" class="fullscreen">
    <div class="container">
      <button onclick="fecharFull('telaAgenda')">Voltar</button>
      <section class="card scroll">
        <h2>Agenda</h2>
        <table>
          <thead>
            <tr>
              <th>Produção</th>
              <th>Entrega</th>
              <th>Cliente</th>
              <th>Descrição</th>
              <th>Tecido</th>
              <th>Status</th>
              <th>⋮</th>
            </tr>
          </thead>
          <tbody id="agendaTabela"></tbody>
        </table>
      </section>
    </div>
  </div>

  <div id="telaHistorico" class="fullscreen">
    <div class="container">
      <button onclick="fecharFull('telaHistorico')">Voltar</button>
      <section class="card scroll">
        <h2>Histórico</h2>
        <table>
          <thead>
            <tr>
              <th>Produção</th>
              <th>Entrega</th>
              <th>Cliente</th>
              <th>Descrição</th>
              <th>Tecido</th>
              <th>Status</th>
              <th>⋮</th>
            </tr>
          </thead>
          <tbody id="historicoTabela"></tbody>
        </table>
      </section>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="header-tabs.js"></script>
</body>
</html>
