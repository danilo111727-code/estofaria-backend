
<div class="card">
<h3>Cadastrar material</h3>

<div class="row">
<input id="materialNome" placeholder="Material">
<select id="materialUnidade"></select>
</div>

<div class="row">
<input id="materialValor" placeholder="R$ 0,00" oninput="formatCurrency(this)">
<button onclick="addMaterial()">Adicionar</button>
</div>
</div>

<div class="card">
<h3>Unidades de medida</h3>

<div class="row">
<input id="novaUnidade" placeholder="Nova unidade">
<button onclick="addUnit()">Adicionar</button>
</div>

<div class="units-scroll" id="unitsContainer"></div>
</div>

<div class="card">

<div class="row between">
<h3>Tabela de materiais</h3>
<button id="lockBtn" onclick="toggleLock()">🔒 Tabela trancada</button>
</div>

<input id="search" placeholder="🔎 Pesquisar material" oninput="filterTable()">

<div class="materials-scroll">
<table>
<thead>
<tr>
<th>Material</th>
<th>Unidade</th>
<th>Valor</th>
<th></th>
</tr>
</thead>
<tbody id="materialsTable"></tbody>
</table>
</div>

</div>
